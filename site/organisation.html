<script>
/* V32 · Organisation: acht Entscheidungen (Wahl, Freigabe Alex und Lea, Begründung), daraus Leas Teamaufbau je Rolle
   (sechs Schritte, Leitung, Stellvertretung) und die Tore der vier Aufbaustufen. Grundlage: Claude-Dokument
   „Wilde Habitate · Organisationsarchitektur“ (05.10.2026). Termine „besetzt bis“ sind Vorschläge.
   Stand über die Edge Function „organisation“; wird eine Entscheidung von beiden freigegeben, schreibt die Seite
   einen Eintrag ins Entscheidungslog (gfweekly/decision_add, mit Habitat-Talern) und vermerkt ihn (log_verknuepfen).
   Ansicht und Filter in localStorage gf_og_view und gf_og_filter, die Akte im Link (?d=4 oder ?r=prod). */
const $=s=>document.querySelector(s);
const OG_FN="https://bnfmupnmqyrcltrphfak.supabase.co/functions/v1/organisation";
async function ogApi(action,payload){
  const res=await fetch(OG_FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,password:gfPW(),payload:Object.assign({who:gfWho()},payload||{})})});
  let d={}; try{ d=await res.json(); }catch(e){}
  if(res.status===401) throw {auth:true,message:"Passwort abgelaufen. Bitte neu entsperren."};
  if(!res.ok){ const e=new Error(d.error||("HTTP "+res.status)); e.status=res.status; e.data=d; throw e; }
  return d;
}

/* ---------- Inhalt (Quelle: Organisationsarchitektur; Rollen und Abhängigkeiten gespiegelt in der Edge Function) ---------- */
const HEUTE="2026-10-05";

const decOk=id=>!!dec(id).freigegeben_am;
const fehlt=r=>r.dep.filter(id=>!decOk(id));
const tage=iso=>Math.round((Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))-Date.UTC(+HEUTE.slice(0,4),+HEUTE.slice(5,7)-1,+HEUTE.slice(8,10)))/864e5);

function rolleZst(r){
  const f=fehlt(r), s=rol(r.id).schritt||0;
  if(f.length) return {k:"lock",l:"wartet auf Entscheidung "+f.join(", ")};
  if(s>=r.steps.length) return {k:"fertig",l:"besetzt, mit Stellvertretung"};
  if(s===0) return {k:"frei",l:"kann starten"};
  return {k:"lauf",l:"Schritt "+s+" von "+r.steps.length};
}
function torVoll(s){ return s.tor.every((x,j)=>ST.tor[s.n+"-"+j]); }
function stufe(){ let l=0; for(const s of S){ if(torVoll(s)) l=s.n; else break; } return l; }
function decZst(id){
  const d=dec(id);
  if(d.freigegeben_am) return {k:"ok",l:"freigegeben"};
  if(d.wahl===null||d.wahl===undefined) return {k:"offen",l:"offen"};
  if(d.alex_frei) return {k:"halb",l:"Lea fehlt"};
  if(d.lea_frei) return {k:"halb",l:"Alex fehlt"};
  return {k:"halb",l:"Freigabe fehlt"};
}
const fpass=(r,f)=>{ f=f||UI.filter; const s=rol(r.id).schritt||0;
  return f==="alle"||(f==="pflicht"&&r.pflicht)||(f==="wartet"&&fehlt(r).length>0)||(f==="frei"&&!fehlt(r).length&&s<r.steps.length); };

function zugListe(){
  const w=ich(), mk=w==="Alex"?"alex_frei":"lea_frei", out=[];
  D.filter(d=>!decOk(d.id)).sort((a,b)=>(a.due||"9")<(b.due||"9")?-1:1).forEach(d=>{
    const x=dec(d.id), eilt=d.due&&tage(d.due)<45;
    if(x.wahl===null||x.wahl===undefined) out.push({k:"dec",id:d.id,head:d.id+" · "+d.t,body:"Möglichkeit wählen · "+frist(d),btn:"Öffnen",eilt,act:"open"});
    else if(!x[mk]) out.push({k:"dec",id:d.id,head:d.id+" · "+d.t,body:"Deine Freigabe fehlt: "+d.opts[x.wahl],btn:"Freigeben",eilt:true,act:"frei"});
  });
  if(w==="Lea") R.filter(r=>!fehlt(r).length&&(rol(r.id).schritt||0)<r.steps.length).sort((a,b)=>a.q1-b.q1||a.q0-b.q0).forEach(r=>{
    const s=rol(r.id).schritt||0;
    out.push({k:"rolle",id:r.id,head:r.t,body:"Als Nächstes: "+r.steps[s]+" · bis "+Q[r.q1],btn:"Erledigt",eilt:r.q1<=1,act:"schritt"});
  });
  return out;
}

function render(){
  if(!GELADEN) return;
  const w=ich(), nOk=D.filter(d=>decOk(d.id)).length, lvl=stufe();

    ? "Stufe "+Math.min(4,lvl+1)+" · "+S[Math.min(3,lvl)].t+" · "+pflOk+" von "+pfl.length+" Pflichtrollen mit Stellvertretung"
    : nOk+" von 8 Entscheidungen freigegeben"+(offen?" · nächste Frist "+offen.bis.split(" ")[0]:"")+" · "+pflOk+" von "+pfl.length+" Pflichtrollen mit Stellvertretung";

  const z=zugListe();
  $("#ogZug").innerHTML=`<div class="og-zug-k"><img src="${AV[w]}" alt="" width="36" height="36"><div><b>${z.length?"Dein Zug, "+w+" · "+z.length+(z.length===1?" Sache":" Sachen"):"Nichts bei dir, "+w}</b><span>${w==="Lea"?"Freigaben, die auf dich warten, und die nächsten Schritte im Teamaufbau, nach Frist.":"Freigaben und Entscheidungen, die auf dich warten. Den Teamaufbau führt Lea."}</span></div></div>`+

  $("#ogDecSum").textContent=nOk+" von 8 freigegeben · jede gilt erst mit Alex und Lea";
  $("#ogDecs").innerHTML=D.map(d=>{
    const x=dec(d.id), s=decZst(d.id), sel=UI.sel.k==="dec"&&UI.sel.id===d.id;
    return `<button type="button" class="og-dec${s.k==="ok"?" ok":""}${sel?" sel":""}" data-open="dec:${d.id}"><span class="r1"><span class="nr">${d.id}</span><span class="og-st ${s.k}">${s.l}</span><span class="og-avs"><img class="${x.alex_frei?"":"aus"}" src="${AV.Alex}" alt="${x.alex_frei?"Alex hat freigegeben":"Alex offen"}" width="22" height="22"><img class="${x.lea_frei?"":"aus"}" src="${AV.Lea}" alt="${x.lea_frei?"Lea hat freigegeben":"Lea offen"}" width="22" height="22"></span></span><span class="t">${gfEsc(d.t)}</span><small>${d.due?"bis "+d.bis.split(" ")[0]+" · "+frist(d):"bis Generalversammlung"}</small></button>`;

function karte(r){

  const lN=x.leitung||(r.id==="gf"?"Alexander und Lea":""), sN=x.stellvertretung||"";
  const krit=r.pflicht&&r.stufe===1&&s<r.steps.length&&z.k!=="lock";
  const slot=(f,l)=>`<span class="og-slot${f?" voll":""}"${f?` style="background:${EC[r.e]}"`:""}>${l}</span>`;
  return `<button type="button" class="og-rk${z.k==="lock"?" lock":""}${krit?" krit":""}${sel?" sel":""}" data-open="rolle:${r.id}"><span class="n"><i style="background:${EC[r.e]}"></i>${gfEsc(r.t)}</span><span class="og-slots">${slot(lN,"L")}<span>${gfEsc(lN||"offen")}</span>${slot(sN,"S")}<span>${gfEsc(sN||"offen")}</span></span><span class="og-segs">${r.steps.map((q,i)=>`<i${i<s?` style="background:${EC[r.e]}"`:""}></i>`).join("")}</span><small>${z.l}</small></button>`;
}

    const rl=R.filter(r=>r.stufe===s.n&&fpass(r)), voll=torVoll(s), n=s.tor.filter((x,j)=>ST.tor[s.n+"-"+j]).length;
    const leer=R.some(r=>r.stufe===s.n)?"Keine Rolle in diesem Filter.":"Keine neue Rolle. Übergaben, Handbücher und Gremien ohne euren Vorsitz.";
    return `<section class="og-stufe${i===lvl?" jetzt":""}${!voll&&i!==lvl?" spaeter":""}"><img src="${IMG[s.n].src}" alt="" width="1600" height="900" loading="lazy"><div class="k"><div class="og-eyebrow">Stufe ${s.n} · ${s.z}</div><h4>${s.t}</h4></div><div class="rl">${rl.length?rl.map(karte).join(""):`<div class="leer">${leer}</div>`}</div><div class="og-tor"><b class="${voll?"ok":""}">${voll?"Tor "+s.n+" erreicht":"Tor "+s.n+" · "+n+" von "+s.tor.length}</b>${s.tor.map((t,j)=>{ const on=!!ST.tor[s.n+"-"+j]; return `<button type="button" data-tor="${s.n}-${j}" aria-pressed="${on}"><span class="og-box${on?" on":""}"></span><span>${gfEsc(t)}</span></button>`; }).join("")}</div></section>`;
  }).join("")}</div>`;
}
function zeitHtml(){
  const grp=e=>e==="Haus"?"Haus · besitzt · Hauspartner":e==="Operations"?"Operations · stellt her · Operations Partner":"Formate · prägen · Formatpartner";
  let h=`<div class="og-zeit"><div class="og-zeit-in"><div class="og-zr kopf"><div></div><div class="st" style="grid-column:2/6;background:var(--action-soft,rgba(228,184,92,.16));color:var(--text)"><span>Stufe 1 · Fundament</span><span>Tor 1</span></div><div class="st" style="grid-column:6/10;background:var(--fill)"><span>Stufe 2 · Operations</span><span>Tor 2</span></div><div class="st" style="grid-column:10/11;background:var(--fill-soft)">Stufe 3</div></div><div class="og-zr kopf q"><div>Rolle</div>${Q.map((q,i)=>`<div style="padding-left:4px${i===0?";color:var(--action);font-weight:600":""}">${q}</div>`).join("")}</div>`;
  ["Haus","Operations","Formate"].forEach(e=>{
    const rows=R.filter(r=>r.e===e&&fpass(r)); if(!rows.length) return;
    h+=`<div class="og-zgr" style="color:${EC[e]}">${grp(e)}</div>`;
    rows.forEach(r=>{
      const z=rolleZst(r), s=rol(r.id).schritt||0, sel=UI.sel.k==="rolle"&&UI.sel.id===r.id;
      const krit=r.pflicht&&r.stufe===1&&s<r.steps.length;
      const cls=z.k==="frei"?"frei":z.k==="lauf"?"lauf":z.k==="fertig"?"fertig":"";
      const st=z.k==="frei"?`border-color:${EC[r.e]}`:z.k==="lauf"?`background:${EC[r.e]};border-color:${EC[r.e]}`:"";
      const lab=z.k==="lock"?"E "+fehlt(r).join(", "):z.k==="frei"?"startklar":z.k==="fertig"?"besetzt":s+"/"+r.steps.length;
      h+=`<div class="og-zr row"><button type="button" class="nm${sel?" sel":""}" data-open="rolle:${r.id}">${gfEsc(r.t)}</button><button type="button" class="bal ${cls}${krit?" krit":""}" style="grid-column:${r.q0+2}/${r.q1+3};${st}" data-open="rolle:${r.id}" title="${gfEsc(z.l+(r.note?" · "+r.note:""))}">${lab}</button></div>`;
    });
  });
  return h+`<div class="og-hinweis">Gestrichelt mit „E 6“: wartet auf Entscheidung 6. Gelber Rand: Pflichtrolle für Tor 1, noch nicht besetzt. Balken: Suche bis „besetzt“ (Vorschlag). Gelb markiert ist das laufende Quartal.</div></div></div>`;
}
function decAkte(id){
  const d=D.find(x=>x.id===id), x=dec(id), w=ich(), ok=decOk(id), gew=x.wahl!==null&&x.wahl!==undefined;
  const app=(p)=>{ const mein=p===w, an=p==="Alex"?x.alex_frei:x.lea_frei, am=p==="Alex"?x.alex_am:x.lea_am;
    const cls=an?"frei":(mein?(gew?"mein":"mein gesperrt"):"");
    const lab=an?p+" hat freigegeben":(mein?"Ich gebe frei":"wartet auf "+p);
    const sub=an?(am?new Date(am).toLocaleDateString("de-DE"):"")+(mein?" · Klick nimmt zurück":""):(mein?(gew?"mit Begründung ins Log":"erst Möglichkeit wählen"):"unten links als "+p+" wechseln");
    return `<button type="button" class="og-app ${cls}" data-frei="${p}:${id}"><img src="${AV[p]}" alt="" width="24" height="24"><span><b>${lab}</b><small>${sub}</small></span></button>`; };
  const frei=R.filter(r=>r.dep.includes(id));
  return `<div class="og-sub">Entscheidung ${id} · bis ${gfEsc(d.bis)}${d.due?" · "+frist(d):""}</div><h3>${gfEsc(d.t)}</h3><div class="why">${gfEsc(d.why)}</div>
  <div class="og-opts" role="radiogroup" aria-label="Möglichkeiten">${d.opts.map((o,i)=>`<button type="button" class="og-opt" role="radio" aria-checked="${x.wahl===i}" data-wahl="${id}:${i}"><i></i><span>${gfEsc(o)}</span></button>`).join("")}</div>
  <label>Begründung fürs Entscheidungslog<textarea rows="2" id="ogWhy" data-id="${id}" placeholder="Warum diese Möglichkeit, was ihr bewusst in Kauf nehmt">${gfEsc(x.begruendung||"")}</textarea></label>
  <div class="og-apps">${app("Alex")}${app("Lea")}</div>
  <div class="why">${ok?"Freigegeben"+(x.log_decision_id?" und im Entscheidungslog.":"."):(gew?"Gewählt; "+(x.alex_frei||x.lea_frei?"eine Freigabe fehlt.":"beide Freigaben fehlen.")+" Eine andere Wahl setzt beide Freigaben zurück.":"Noch keine Möglichkeit gewählt.")}</div>
  <div class="og-sub">Schaltet frei</div><div class="og-chips">${frei.map(r=>`<button type="button" class="${fehlt(r).length?"":"ok"}" data-open="rolle:${r.id}">${gfEsc(r.t)}</button>`).join("")}</div>`;
}
function rolleAkte(id){
  const r=R.find(x=>x.id===id), x=rol(id), z=rolleZst(r), s=x.schritt||0, lock=z.k==="lock";
  const part=r.e==="Formate"?"Formatpartner":r.e==="Operations"?"Operations Partner":"Haus";
  return `<div class="og-sub">${r.e} · ${part} · Stufe ${r.stufe}${r.phase?" · "+gfEsc(r.phase):""}</div><h3>${gfEsc(r.t)}</h3><div class="og-zst ${z.k==="fertig"?"fertig":lock?"":"frei"}">${z.l}</div>
  <div class="og-2"><label>Leitung<input type="text" id="ogLead" data-id="${id}" maxlength="120" value="${gfEsc(x.leitung||(id==="gf"?"Alexander und Lea":""))}" placeholder="Name eintragen"></label><label>Stellvertretung<input type="text" id="ogStv" data-id="${id}" maxlength="120" value="${gfEsc(x.stellvertretung||"")}" placeholder="Name eintragen"></label></div>
  <div class="og-sub">Leas Schritte</div><div class="og-steps">${r.steps.map((t,i)=>`<button type="button" class="og-step${i<s?" done":""}${i===s&&!lock?" naechst":""}${lock?" lock":""}" data-schritt="${id}:${i+1}" aria-pressed="${i<s}"><b>${i+1}</b><span>${gfEsc(t)}</span></button>`).join("")}</div>
  <dl class="og-dl"><dt>Stand</dt><dd>${gfEsc(r.heute)}</dd><dt>Anforderungen</dt><dd>${gfEsc(r.anf)}</dd><dt>Vertretung</dt><dd>${gfEsc(r.stv)}</dd><dt>Instrument</dt><dd>${gfEsc(r.partner)}</dd><dt>Umfang</dt><dd>${gfEsc(r.umfang)}</dd><dt>Besetzt bis</dt><dd>${Q[r.q1]} (Vorschlag)${r.note?" · "+gfEsc(r.note):""}</dd></dl>
  <div class="og-chips">${r.dep.map(d=>`<button type="button" class="${decOk(d)?"ok":""}" data-open="dec:${d}">${decOk(d)?"freigegeben":"wartet"} · ${d} ${gfEsc(D.find(y=>y.id===d).t)}</button>`).join("")}</div>`;
}

/* ---------- Meldung mit Bild ---------- */
let _ogm=null;
function melde(txt,bild){ const m=$("#ogMeldung"); $("#ogMeldungTxt").textContent=txt; $("#ogMeldungImg").src=bild||IMG[0].src; m.classList.add("show"); clearTimeout(_ogm); _ogm=setTimeout(()=>m.classList.remove("show"),3800); }

/* ---------- Schreiben ---------- */
async function laden(){
  const d=await ogApi("get");
  ST={dec:{},rolle:{},tor:{}};
  (d.entscheidungen||[]).forEach(x=>ST.dec[x.id]=x);
  (d.rollen||[]).forEach(x=>ST.rolle[x.id]=x);
  (d.tore||[]).forEach(x=>ST.tor[x.key]=!!x.erfuellt);
  GELADEN=true; render();
}
async function konflikt(e){
  if(e&&e.auth){ gfToast(e.message); return; }
  gfToast(e&&e.status===409?(e.message+" · neu geladen"):("Nicht gespeichert: "+(e&&e.message||"Verbindung")));
  try{ await laden(); }catch(x){}
}
async function wahl(id,i){
  const x=dec(id);
  if(x.freigegeben_am){ gfToast("Schon freigegeben. Erst eine Freigabe zurücknehmen."); return; }
  if(x.wahl===i) return;
  const alt=Object.assign({},x); ST.dec[id]=Object.assign({},x,{wahl:i,alex_frei:false,lea_frei:false}); render();
  try{ const r=await ogApi("wahl",{id,wahl:i,expect_rev:alt.rev}); ST.dec[id]=r.entscheidung; render(); }
  catch(e){ ST.dec[id]=alt; await konflikt(e); }
}
async function freigabe(p,id){
  const w=ich(), x=dec(id);
  if(p!==w){ gfToast("Freigeben kann nur "+p+". Unten links auf „als "+p+"“ wechseln."); return; }
  if(x.wahl===null||x.wahl===undefined){ gfToast("Erst eine Möglichkeit wählen, dann freigeben."); return; }
  const mk=w==="Alex"?"alex_frei":"lea_frei", on=!x[mk];
  const why=$("#ogWhy"); if(why&&why.dataset.id==id&&(why.value||"")!==(x.begruendung||"")) await begruendung(id,why.value);
  try{
    const r=await ogApi("freigabe",{id,on,expect_wahl:x.wahl});
    ST.dec[id]=r.entscheidung; render();
    if(r.neu_freigegeben){
      const d=D.find(y=>y.id===id);
      const n=R.filter(q=>q.dep.includes(id)&&!fehlt(q).length).length;
      const alle=D.every(y=>decOk(y.id));
      melde(alle?"Alle acht Entscheidungen stehen. Stufe 1 beginnt.":"Entscheidung "+id+" freigegeben · "+n+(n===1?" Rolle":" Rollen")+" startklar", alle?IMG[1].src:IMG[0].src);
      if(!ST.dec[id].log_decision_id) ins_log(d, ST.dec[id]);
    }
  }catch(e){ await konflikt(e); }
}
async function ins_log(d,x){
  try{
    const frei=R.filter(r=>r.dep.includes(d.id)).map(r=>r.t).join(", ");
    const res=await gfApi("decision_add",{decision:d.t+": "+d.opts[x.wahl]+(x.begruendung?" · Begründung: "+x.begruendung:""),
      topic_title:"Organisation · Entscheidung "+d.id, strand:"habitate", decided_by:"Alex und Lea", owner:"Lea",
      next_action:frei?"Teamaufbau: "+frei:"", decided_at:heuteIso()});
    if(res&&res.decision&&res.decision.id){ await ogApi("log_verknuepfen",{id:d.id,decision_id:res.decision.id}); ST.dec[d.id].log_decision_id=res.decision.id; render(); }
  }catch(e){ gfToast("Freigegeben, aber nicht ins Entscheidungslog geschrieben: "+(e.message||"Verbindung")); }
}
async function begruendung(id,text){
  try{ const r=await ogApi("begruendung",{id,text}); ST.dec[id]=Object.assign({},dec(id),{begruendung:r.entscheidung.begruendung}); }
  catch(e){ await konflikt(e); }
}
async function rolleSpeichern(id,patch,ok){
  const x=rol(id), alt=Object.assign({},x);
  ST.rolle[id]=Object.assign({},x,patch); render();
  try{ const r=await ogApi("rolle",{id,patch,expect_rev:alt.rev||0}); ST.rolle[id]=r.rolle; render(); if(ok) ok(r.rolle); }
  catch(e){ ST.rolle[id]=alt; await konflikt(e); }
}
function schritt(id,n){
  const r=R.find(x=>x.id===id), f=fehlt(r);
  if(f.length){ gfToast("Wartet noch auf Entscheidung "+f.join(", ")+"."); return; }
  const cur=rol(id).schritt||0, v=Math.max(0,cur===n?n-1:n);
  rolleSpeichern(id,{schritt:v},neu=>{ if(neu.schritt===r.steps.length&&cur<r.steps.length) melde(r.t+": besetzt, mit Stellvertretung.",IMG[Math.min(4,stufe()+1)].src); });
}
async function tor(key){
  const on=!ST.tor[key], [n]=key.split("-").map(Number); const vorher=stufe();
  ST.tor[key]=on; render();
  try{ await ogApi("tor",{key,on}); const nach=stufe(); if(nach>vorher) melde("Tor "+nach+" erreicht · "+IMG[nach].art+" steht.",IMG[nach].src); }
  catch(e){ ST.tor[key]=!on; await konflikt(e); }
}
function oeffne(k,id){
  UI.sel={k,id}; render();
  const q=new URLSearchParams(location.search); q.delete("d"); q.delete("r"); q.set(k==="dec"?"d":"r",id); history.replaceState(null,"","?"+q.toString());
  if(window.matchMedia("(max-width:1180px)").matches) $("#ogAkte").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------- Bedienung ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-open],[data-peek],[data-view],[data-fil],[data-wahl],[data-frei],[data-schritt],[data-tor],[data-zug]"); if(!t) return;
  if(t.dataset.open){ const [k,id]=t.dataset.open.split(":"); oeffne(k,k==="dec"?+id:id); return; }
  if(t.dataset.peek!==undefined){ const i=+t.dataset.peek; UI.peek=(UI.peek===i||i===stufe())?null:i; render(); return; }
  if(t.dataset.view){ UI.view=t.dataset.view; try{ localStorage.setItem("gf_og_view",UI.view); }catch(x){} render(); return; }
  if(t.dataset.fil){ UI.filter=t.dataset.fil; try{ localStorage.setItem("gf_og_filter",UI.filter); }catch(x){} render(); return; }
  if(t.dataset.wahl){ const [id,i]=t.dataset.wahl.split(":").map(Number); wahl(id,i); return; }
  if(t.dataset.frei){ const [p,id]=t.dataset.frei.split(":"); freigabe(p,+id); return; }
  if(t.dataset.schritt){ const [id,n]=t.dataset.schritt.split(":"); schritt(id,+n); return; }
  if(t.dataset.tor){ tor(t.dataset.tor); return; }
  if(t.dataset.zug){ const [a,k,id]=t.dataset.zug.split(":");
    if(a==="open") oeffne(k,k==="dec"?+id:id);
    else if(a==="frei") freigabe(ich(),+id);
    else if(a==="schritt") schritt(id,(rol(id).schritt||0)+1);
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="ogWhy"){ const id=+t.dataset.id; if((t.value||"")!==(dec(id).begruendung||"")) begruendung(id,t.value); }
  if(t.id==="ogLead"||t.id==="ogStv"){ const id=t.dataset.id, f=t.id==="ogLead"?"leitung":"stellvertretung"; if((t.value||"").trim()!==(rol(id)[f]||"")) rolleSpeichern(id,{[f]:t.value.trim()}); }
});
document.addEventListener("gf-who",()=>render());
$("#ogNext").onclick=()=>{ const z=zugListe(); if(z.length) oeffne(z[0].k,z[0].k==="dec"?z[0].id:z[0].id); else gfToast("Nichts offen bei dir."); };

gfGate(async()=>{
  $("#app").style.display="block"; gfMountTopbar("organisation");
  try{ await laden(); }
  catch(e){ $("#ogMain").innerHTML=`<div class="loading">Nicht geladen: ${gfEsc(e.message||"Verbindung")}</div>`; }
});
</script>
</body>
</html>
