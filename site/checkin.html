<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#17171a" />
<title>GF Weekly · Check-in vorbereiten</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=17" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png?v=17" />
<link rel="apple-touch-icon" href="/assets/icon-180.png?v=17" />
<link rel="manifest" href="/assets/manifest.webmanifest?v=17" />
<link rel="stylesheet" href="/assets/styles.css?v=17" />
<script>(function(){var t=localStorage.getItem("gf_theme");document.documentElement.dataset.theme=(t==="light"||t==="colorful")?"light":"dark";})();</script>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="mark pic"><img src="/assets/img/flagge-144.png" alt="" width="54" height="54"></div>
    <span class="badge-conf">Wilde Möhre · vertraulich</span>
    <h1>GF Weekly</h1>
    <div class="sub">Check-in · Geschäftsleitung Wilde Möhre · Alex &amp; Lea</div>
    <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" />
    <button class="btn btn-primary" id="unlock" style="width:100%;justify-content:center;margin-top:4px">Entsperren</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="app wrap" id="app">
  <header id="topbar"></header>
  <div id="hero"></div>

  <div class="dash" id="dash"></div>

  <div class="section">
    <div class="sec-h"><h2>Agenda</h2><span class="hint" id="agendaHint">in der Reihenfolge des Besprechungsmodus</span><span class="line"></span>
      <label class="chk"><input type="checkbox" id="showRec" /> wiederkehrende zeigen</label>
      <a class="btn btn-sm btn-primary" href="board.html?meeting=1">Besprechung starten</a>
      <button class="btn btn-sm btn-ghost" id="copyBtn">Agenda kopieren</button></div>
    <div class="agenda" id="agenda"></div>
  </div>

  <div class="section">
    <div class="sec-h"><h2>Vorbereitung</h2><span class="hint">was vor dem Termin einen Blick braucht</span><span class="line"></span></div>
    <div class="prep-grid" id="prep"></div>
  </div>

  <div class="section" id="lastWrap"></div>
</div>

<div class="toast" id="toast"></div>
<script src="/assets/core.js?v=17"></script>
<script src="/assets/game.js?v=17"></script>
<script src="/assets/eggs.js?v=17" defer></script>
<script>
/* V15: Check-in = Vorbereitung auf das Weekly, direkt aus den Board-Spalten (kein eigener Datenstand mehr). */
const $=s=>document.querySelector(s);
const LANE_LABEL={zu_besprechen:"Zu besprechen",in_klaerung:"In Klärung",entschieden:"Entschieden",erledigt:"Erledigt"};
let TOPICS=[], SESSIONS=[], SHOW_REC=localStorage.getItem("gf_board_rec")==="1";
const NOW=new Date(), today=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const iso=d=>d.toISOString().slice(0,10);
function endOfWeek(){ const d=new Date(today); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()+(6-dow)); return d; }
const ageDays=t=>Math.floor((NOW-new Date(t.created_at))/86400000);
const who=t=>t.owner||t.delegate_to||"";
const PO={hoch:0,mittel:1,niedrig:2}, LO={zu_besprechen:0,in_klaerung:1};

function agendaItems(){
  return TOPICS.filter(t=>!t.archived && (SHOW_REC||t.kind!=="recurring") && (t.board_lane==="zu_besprechen"||t.board_lane==="in_klaerung"))
    .sort((a,b)=>(LO[a.board_lane]-LO[b.board_lane])||(PO[a.priority]-PO[b.priority])||(a.lane_order-b.lane_order));
}
function lastSession(){ return SESSIONS.find(s=>s.ended_at)||SESSIONS[0]||null; }
function sinceDate(){ const s=lastSession(); return s ? new Date(s.ended_at||s.started_at) : new Date(NOW-7*86400000); }

function item(t, extra){
  const ex=extra||"";
  return `<a class="prep-item link" href="board.html?topic=${t.id}"><div class="pt">${gfEsc(t.title.length>120?t.title.slice(0,120)+"…":t.title)}</div>
    <div class="pm"><span class="pill p-${t.priority}">${t.priority}</span><span class="pill s-${t.status}">${LANE_LABEL[t.board_lane]||""}</span>${who(t)?`<span class="mchip">${gfEsc(who(t))}</span>`:""}${ex}</div></a>`;
}
function col(title, items, emptyText, extraFn){
  return `<div class="prep-col"><h3>${title} <span style="color:var(--muted)">(${items.length})</span></h3>${items.length?items.map(t=>item(t, extraFn?extraFn(t):"")).join(""):`<div class="prep-item" style="color:var(--muted)">${emptyText}</div>`}</div>`;
}

function render(){
  const ag=agendaItems(); const hoch=ag.filter(t=>t.priority==="hoch").length;
  const since=sinceDate();
  const open=TOPICS.filter(t=>!t.archived && t.board_lane!=="erledigt");
  const fresh=open.filter(t=>new Date(t.created_at)>since).sort((a,b)=>a.created_at<b.created_at?1:-1);
  const due=open.filter(t=>t.next_suggested && new Date(t.next_suggested+"T00:00:00")<=endOfWeek()).sort((a,b)=>a.next_suggested<b.next_suggested?-1:1);
  const overdue=due.filter(t=>t.next_suggested<iso(today));
  const stale=open.filter(t=>t.kind!=="recurring" && ageDays(t)>28 && t.board_lane!=="entschieden").sort((a,b)=>a.created_at<b.created_at?-1:1);
  const decided=TOPICS.filter(t=>!t.archived && t.board_lane==="entschieden").sort((a,b)=>a.lane_order-b.lane_order);

  $("#dash").innerHTML=`
    <div class="stat accent"><div class="k">Agenda</div><div class="v">${ag.length}</div><div class="cap">${hoch} mit Priorität hoch</div></div>
    <div class="stat"><div class="k">Neu</div><div class="v">${fresh.length}</div><div class="cap">seit ${lastSession()?"der letzten Besprechung":"7 Tagen"}</div></div>
    <div class="stat"><div class="k">Termin</div><div class="v">${due.length}</div><div class="cap">${overdue.length?overdue.length+" überfällig":"diese Woche"}</div></div>
    <div class="stat"><div class="k">Lange offen</div><div class="v">${stale.length}</div><div class="cap">älter als vier Wochen</div></div>`;
  document.querySelectorAll(".stat .v").forEach(el=>gfCountUp(el, parseInt(el.textContent)||0));

  $("#showRec").checked=SHOW_REC;
  $("#agenda").innerHTML = ag.length ? ag.map((t,i)=>`<a class="ag-item link" href="board.html?topic=${t.id}">
      <div class="ag-h"><span class="ag-num">${i+1}.</span><span class="ag-t">${gfEsc(t.title.length>140?t.title.slice(0,140)+"…":t.title)}</span><span class="ag-min"><span class="pill p-${t.priority}">${t.priority}</span> <span class="pill s-${t.status}">${LANE_LABEL[t.board_lane]}</span></span></div>
      <div class="ag-meta">${t.short_description?`<div>${gfEsc(t.short_description)}</div>`:""}${t.next_action?`<div><b>Nächster Schritt:</b> ${gfEsc(t.next_action)}</div>`:""}<div>${who(t)?`<b>Verantwortung:</b> ${gfEsc(who(t))} · `:""}${ageDays(t)} Tage alt${t.next_suggested?` · Termin ${gfFmtShort(t.next_suggested)}`:""}${t.last_discussed?` · zuletzt besprochen ${gfFmtShort(t.last_discussed)}`:""}</div></div>
    </a>`).join("") : `<div class="tidy-none">Nichts zu besprechen. Neue Themen kommen über <a href="capture.html">Eingabe</a> oder das Board.</div>`;
  $("#agendaHint").textContent=`${ag.length} Themen · Zu besprechen zuerst, dann In Klärung, je Spalte Priorität hoch zuerst`;

  $("#prep").innerHTML=
    col("Neu seit "+(lastSession()?gfFmtShort(since.toISOString()):"7 Tagen"), fresh, "nichts Neues", t=>`<span class="mchip">${gfFmtShort(t.created_at)}${t.created_by?" · "+gfEsc(t.created_by):""}</span>`)+
    col("Termin diese Woche oder überfällig", due, "keine Termine", t=>`<span class="mchip ${t.next_suggested<iso(today)?"time-chip":""}">${t.next_suggested<iso(today)?"überfällig · ":""}${gfFmtShort(t.next_suggested)}</span>`)+
    col("Länger als vier Wochen offen", stale, "nichts liegt lange", t=>`<span class="mchip">${ageDays(t)} Tage</span>`)+
    col("Entschieden, nächster Schritt läuft", decided, "keine offenen Beschlüsse", t=>t.next_action?`<span class="mchip">${gfEsc(t.next_action.length>60?t.next_action.slice(0,60)+"…":t.next_action)}</span>`:`<span class="mchip time-chip">nächster Schritt fehlt</span>`);

  const ls=lastSession();
  $("#lastWrap").innerHTML= ls ? `<div class="sec-h"><h2>Letzte Besprechung</h2><span class="line"></span><a class="btn btn-sm btn-ghost" href="entscheidungen.html">Entscheidungslog</a></div>
    <div class="prep-item"><div class="pt">${gfFmtDay(ls.started_at)}${ls.ended_at?` · ${gfFmtTime(ls.started_at)}–${gfFmtTime(ls.ended_at)}`:" · läuft noch"}</div>
    <div class="pm"><span class="mchip">${gfEsc(ls.participants||"")}</span>${Array.isArray(ls.summary)?`<span class="mchip">${ls.summary.length} Themen behandelt</span><span class="mchip">${ls.summary.filter(x=>x.outcome==="entschieden").length} Entscheidungen</span>`:""}</div></div>` : "";
  gfStagger($("#agenda"),".ag-item");
}

function agendaText(){
  const ag=agendaItems(); const L=[`GF Weekly · Check-in-Agenda · ${gfFmtDay(NOW)}`,""];
  ag.forEach((t,i)=>{ L.push(`${i+1}. ${t.title} [${LANE_LABEL[t.board_lane]} · ${t.priority}]`); if(t.short_description) L.push(`   ${t.short_description}`); if(t.next_action) L.push(`   Nächster Schritt: ${t.next_action}`); if(who(t)) L.push(`   Verantwortung: ${who(t)}`); L.push(""); });
  L.push(`${ag.length} Themen · erstellt mit GF Weekly · gfweekly.netlify.app`);
  return L.join("\n");
}
$("#copyBtn").onclick=()=>{ if(!agendaItems().length){ gfToast("Keine Themen in der Agenda"); return; } gfTextModal("Check-in-Agenda", agendaText(), { subject:`GF-Check-in ${gfFmtShort(NOW.toISOString())} · Agenda`, intro:"Zum Kopieren oder per Mail an Alex und Lea." }); };
$("#showRec").onchange=e=>{ SHOW_REC=e.target.checked; localStorage.setItem("gf_board_rec",SHOW_REC?"1":"0"); render(); };

gfGate(async()=>{
  $("#app").style.display="block"; gfMountTopbar("checkin");
  gfMountHero("lager","Check-in vorbereiten","Fünf Minuten vor dem Weekly: was ansteht, was neu ist, was wartet. Alles kommt live aus dem Board.",{compact:true, aside:`<a class="btn btn-sm btn-primary" href="board.html?meeting=1">Besprechung starten</a><a class="btn btn-sm" href="board.html">Zum Board</a>`});
  $("#dash").innerHTML=gfSkeleton(4,"stat"); $("#agenda").innerHTML=gfSkeleton(3,"");
  try{
    const [d,s]=await Promise.all([gfApi("list"), gfApi("sessions_list",{limit:5}).catch(()=>({sessions:[]}))]);
    TOPICS=d.topics||[]; SESSIONS=s.sessions||[]; render();
  }catch(e){ $("#agenda").innerHTML=`<div class="empty">Fehler beim Laden: ${gfEsc(e.message||"Verbindung")}</div>`; }
});
</script>
</body>
</html>
