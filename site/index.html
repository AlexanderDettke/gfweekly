<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#171d18" />
<title>Das Hohe Haus · Für dich</title>
<meta name="description" content="Für dich: deine Entscheidungen, seit gestern, nächste Fristen. Vertraulich." />
<meta property="og:title" content="Das Hohe Haus · Geschäftsführung der Wilden Habitate" />
<meta property="og:description" content="Strategie, Entscheidungen & Check-ins der Geschäftsleitung, Wilde Möhre." />
<meta property="og:image" content="assets/og-image.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=23" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png?v=23" />
<link rel="apple-touch-icon" href="/assets/icon-180.png?v=23" />
<link rel="manifest" href="/assets/manifest.webmanifest?v=23" />
<link rel="stylesheet" href="/assets/styles.css?v=23" />
<script>(function(){var t=localStorage.getItem("gf_theme");document.documentElement.dataset.theme=(t==="light"||t==="colorful")?"light":"dark";var n=null;try{n=localStorage.getItem("gf_nav")}catch(e){}var d=document.documentElement;d.dataset.nav=matchMedia("(max-width:1023px)").matches?"drawer":((n==="open"||n==="rail")?n:(matchMedia("(min-width:1280px)").matches?"open":"rail"));})();</script>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="mark pic"><img src="/assets/img/burg-288.png" alt="" width="54" height="54"></div>
    <span class="badge-conf">Wilde Möhre · vertraulich</span>
    <h1>Das Hohe Haus</h1>
    <div class="sub">Große Fragen. Klare Entscheidungen. Gelegentlich Kaffee oder besser Wein?</div>
    <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" />
    <button class="btn btn-primary" id="unlock" style="width:100%;justify-content:center;margin-top:4px">Entsperren</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="app wrap" id="app">
  <header id="topbar"></header>
  <div id="hero"></div>

  <!-- V22c · Für dich: drei Blöcke, sonst nichts. -->
  <section class="fd" id="fdEnt" aria-label="Deine Entscheidung">
    <div class="fd-h"><h2>Deine Entscheidung</h2><span class="fd-n" id="fdEntN"></span><span class="line"></span><a class="btn btn-sm btn-primary" id="fdMeet" href="besprechung.html" hidden>Zur Besprechung</a></div>
    <div class="fd-list" id="fdEntL"><div class="loading">lädt …</div></div>
  </section>

  <section class="fd" id="fdNeu" aria-label="Seit gestern">
    <div class="fd-h"><h2>Seit gestern</h2><span class="fd-n" id="fdNeuN"></span><span class="line"></span><a class="btn btn-sm btn-ghost" href="neuigkeiten.html">Neuigkeiten →</a></div>
    <div class="fd-brief" id="fdBrief"></div>
    <div class="kk-row fd-kk" id="fdKk"></div>
  </section>

  <section class="fd" id="fdFr" aria-label="Nächste Fristen">
    <div class="fd-h"><h2>Nächste Fristen</h2><span class="line"></span><a class="btn btn-sm btn-ghost" href="jahr.html">Jahr →</a></div>
    <div class="fd-list" id="fdFrL"></div>
  </section>
</div>

<div class="toast" id="toast"></div>
<script src="/assets/core.js?v=23"></script>
<script src="/assets/game.js?v=23"></script>
<script src="/assets/eggs.js?v=23" defer></script>
<script>
/* V22c · Für dich. Für den Blick zwischendurch, am Handy, in unter einer Minute.
   Block 1: Einträge mit gate = gf oder = eigene Person (gate_list), sortiert nach Frist, dann Alter, höchstens fünf.
   Block 2: Briefing des Laufs (news_list kind lage, je Strang ein Satz, höchstens sechs) und zwei Plattform-Zahlen (platform_digest).
   Block 3: die drei nächsten Daten aus Fristen, Zieldaten der Partner, Meilensteinen und Kalender-Tickern. */
const $=s=>document.querySelector(s);
const NOW=new Date(); const TODAY=NOW.toLocaleDateString("sv-SE");
let GL=null, LAGE=[], CAL=[], DIG=null, MS=[], STRANDS=[];
function meWho(){ return gfWho()==="Lea"?"lea":"alex"; }
function dayDiff(d){ const a=new Date(TODAY+"T00:00:00"), b=new Date((d||"").slice(0,10)+"T00:00:00"); return Math.round((b-a)/86400000); }
function fmtD(d){ return d?new Date(d.slice(0,10)+"T00:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}):""; }
/* Frist als Datum plus Wort, nie nur Farbe */
function fristWord(d){
  if(!d) return null; const n=dayDiff(d);
  if(n<0) return {t:`${fmtD(d)} · überfällig`,tone:"crit"};
  if(n===0) return {t:`${fmtD(d)} · heute`,tone:"warn"};
  if(n<=6) return {t:`${fmtD(d)} · diese Woche`,tone:"warn"};
  if(n<=13) return {t:`${fmtD(d)} · nächste Woche`,tone:"info"};
  return {t:fmtD(d),tone:""};
}
function strandLabel(k){ const s=STRANDS.find(x=>x.key===k); return s?(s.short||s.label):(k||""); }
function itemHref(x){ return x.kind==="thema"?`board.html?topic=${x.id}`:"neuigkeiten.html"; }
function itemSort(a,b){ return (a.gate_frist||"9999").localeCompare(b.gate_frist||"9999") || (a.created_at||"").localeCompare(b.created_at||""); }

/* ---- Block 1 ---- */
function renderEnt(){
  const me=meWho(); const items=(GL.items||[]).filter(x=>x.gate==="gf"||x.gate===me).sort(itemSort);
  const gf=items.filter(x=>x.gate==="gf").length;
  $("#fdEntN").textContent=items.length?`${items.length}`:"";
  $("#fdMeet").hidden=!gf;
  if(!items.length){
    const last=(CAL.concat(LAGE)).sort((a,b)=>(b.happened_at||"").localeCompare(a.happened_at||""))[0];
    $("#fdEntL").innerHTML=`<p class="fd-empty">Nichts wartet auf dich.${last?` Zuletzt bewegt: ${gfEsc(last.title)} (${gfNewsWhen(last.happened_at)}).`:""}</p>`; return;
  }
  const show=items.slice(0,5), rest=items.length-show.length;
  $("#fdEntL").innerHTML=show.map(x=>{
    const f=fristWord(x.gate_frist); const who=x.gate==="gf"?"GF gemeinsam":(x.gate==="lea"?"Lea":"Alex");
    const note=x.gate_note||x.short_description||(x.kind==="thema"?gfFirstSentence(x.context||"",160):gfFirstSentence(x.body||"",160));
    return `<a class="fd-row" href="${itemHref(x)}">
      <div class="fd-main"><div class="fd-title">${gfEsc(x.title||"")}</div>${note?`<div class="fd-note">${gfEsc(note)}</div>`:""}</div>
      <div class="fd-side">${f?gfZustand(f.tone||"info",f.t):`<span class="fd-muted">ohne Frist</span>`}<span class="fd-who">${who}${x.gate_by==="lauf"?" · Vorschlag":""}</span></div>
    </a>`;
  }).join("")+(rest?`<a class="fd-more" href="aufraeumen.html">und ${rest} weitere →</a>`:"");
  gfStagger($("#fdEntL"),".fd-row");
}

/* ---- Block 2 ---- */
function renderNeu(){
  const since=new Date(Date.now()-7*86400000).toISOString();
  const rows=LAGE.filter(x=>(x.happened_at||"")>=since).sort((a,b)=>(b.happened_at||"").localeCompare(a.happened_at||"")).slice(0,6);
  $("#fdNeuN").textContent=rows.length?`${rows.length} Stränge`:"";
  $("#fdBrief").innerHTML=rows.length
    ? `<p>${rows.map(x=>`<span class="fd-sent"><b>${gfEsc(strandLabel(x.strand)||x.title)}:</b> ${gfEsc(gfFirstSentence(x.body||x.title||"",220))}</span>`).join(" ")}</p><div class="fd-muted">Stand ${gfNewsWhen(rows[0].happened_at)}</div>`
    : `<p class="fd-empty">Kein Briefing in den letzten sieben Tagen.</p>`;
  if(DIG&&DIG.wwp){
    $("#fdKk").innerHTML=[
      gfKachel({icon:"partner",value:DIG.wwp.partners_moved_count||0,label:"Partner mit Bewegung",unit:`${DIG.days} Tage`,href:"jahr.html"}),
      gfKachel({icon:"frist",value:DIG.wwp.overdue_count||0,label:"Zieldaten überfällig",tone:(DIG.wwp.overdue_count||0)>0?"warn":"",href:"jahr.html"}),
    ].join("");
  } else $("#fdKk").innerHTML="";
}

/* ---- Block 3 ---- */
function renderFr(){
  const me=meWho(); const out=[];
  (GL.items||[]).filter(x=>x.gate_frist&&x.gate_frist>=TODAY&&(x.gate==="gf"||x.gate===me)).forEach(x=>out.push({d:x.gate_frist,art:"Frist",t:x.title,href:itemHref(x)}));
  (DIG?.wwp?.upcoming||[]).forEach(p=>out.push({d:p.target_on,art:"Partner",t:`${p.name}${p.next_action?` · ${p.next_action}`:""}`,href:DIG.wwp.url}));
  MS.filter(m=>m.date_from&&m.date_from>=TODAY).forEach(m=>out.push({d:m.date_from,art:"Meilenstein",t:m.title,href:"jahr.html"}));
  CAL.filter(x=>(x.happened_at||"").slice(0,10)>=TODAY).forEach(x=>out.push({d:x.happened_at.slice(0,10),art:"Termin",t:x.title,href:"neuigkeiten.html"}));
  out.sort((a,b)=>a.d.localeCompare(b.d));
  const top=out.slice(0,3);
  $("#fdFrL").innerHTML=top.length ? top.map(o=>{ const f=fristWord(o.d); return `<a class="fd-row fd-fr" href="${o.href}" ${o.href.startsWith("http")?'target="_blank" rel="noopener"':""}>
      <div class="fd-main"><div class="fd-title">${gfEsc(o.t.replace(/^Termin:\s*/i,""))}</div><div class="fd-note">${o.art}</div></div>
      <div class="fd-side">${gfZustand(f.tone||"info",f.t)}</div></a>`; }).join("")
    : `<p class="fd-empty">Keine Daten in Sicht.</p>`;
}

function renderAll(){ renderEnt(); renderNeu(); renderFr(); }
async function load(){
  const [gl, lg, cal, dig, ms, cyc]=await Promise.all([
    gfApi("gate_list",{limit:1000}),
    gfApi("news_list",{kinds:["lage"],limit:60}).catch(()=>({items:[]})),
    gfApi("news_list",{kinds:["ticker"],since:new Date(Date.now()-86400000).toISOString(),limit:120}).catch(()=>({items:[]})),
    gfApi("platform_digest",{days:7}).catch(()=>null),
    gfApi("milestones_list",{all:false}).catch(()=>({milestones:[]})),
    gfApi("cycle_get",{year:NOW.getFullYear()}).catch(()=>({strands:[]})),
  ]);
  GL=gl; LAGE=lg.items||[]; CAL=(cal.items||[]).filter(x=>x.source==="kalender"); DIG=dig; MS=ms.milestones||[]; STRANDS=cyc.strands||[];
  renderAll();
}
gfGate(async()=>{
  $("#app").style.display="block"; gfMountTopbar("start");
  const wd=NOW.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  gfMountHero("ankunft", `${gfAvatarTag(gfWho(),"hero-av")}Guten Tag, ${gfEsc(gfWho())}`, `<span class="hero-date">${wd} · ${GF_APP_SUB}</span>`, {slim:true});
  document.addEventListener("gf-who",e=>{ gfHeroText(`${gfAvatarTag(e.detail,"hero-av")}Guten Tag, ${gfEsc(e.detail)}`,null); if(GL) renderAll(); });
  try{ await load(); }catch(e){ $("#fdEntL").innerHTML=`<div class="empty">Konnte nicht laden: ${gfEsc(e.message||"Verbindung")}</div>`; }
});
</script>
</body>
</html>
