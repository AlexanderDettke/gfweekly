<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#171d18" />
<title>Das Hohe Haus · Vorhaben</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=35" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png?v=35" />
<link rel="apple-touch-icon" href="/assets/icon-180.png?v=35" />
<link rel="manifest" href="/assets/manifest.webmanifest?v=35" />
<link rel="stylesheet" href="/assets/styles.css?v=35" />
<script>(function(){var t=localStorage.getItem("gf_theme");document.documentElement.dataset.theme=(t==="light"||t==="colorful")?"light":"dark";var n=null;try{n=localStorage.getItem("gf_nav")}catch(e){}var d=document.documentElement;d.dataset.nav=matchMedia("(max-width:1023px)").matches?"drawer":((n==="open"||n==="rail")?n:(matchMedia("(min-width:1280px)").matches?"open":"rail"));})();</script>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="mark pic"><img src="/assets/img/burg-288.png" alt="" width="54" height="54"></div>
    <span class="badge-conf">Wilde Möhre · vertraulich</span>
    <h1>Das Hohe Haus</h1>
    <div class="sub">Vorhaben · Geschäftsführung der Wilden Habitate · Alex &amp; Lea</div>
    <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" />
    <button class="btn btn-primary" id="unlock" style="width:100%;justify-content:center;margin-top:4px">Entsperren</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="app wrap vh-wrap" id="app" style="--maxw:1376px">
  <header id="topbar"></header>

  <div class="vh-kopf">
    <div class="vh-kopf-t">
      <div class="vh-eyebrow" id="vhMeta">Metaphase</div>
      <h2>Vorhaben</h2>
      <div class="vh-lage" id="vhLage" role="status"></div>
    </div>
    <div class="vh-kopf-a">
      <button type="button" class="btn btn-brand" id="vhUebergabe">Übergeben</button>
      <button type="button" class="btn btn-primary" id="vhEinwurf"><span aria-hidden="true">+</span> Einwurf</button>
    </div>
  </div>

  <button type="button" class="vh-warte" id="vhWarte" hidden></button>

  <div class="vh-steuer">
    <div class="vh-reihe" role="group" aria-label="Ansicht" id="vhViews"></div>
    <div class="vh-reihe" role="group" aria-label="Filter" id="vhFilter"></div>
  </div>

  <div class="vh-grid" id="vhGrid">
    <section id="vhMain" class="vh-main" aria-label="Vorhaben" aria-live="polite"><div class="loading">lädt …</div></section>
    <aside id="vhAkte" class="vh-akte" aria-label="Akte" hidden></aside>
  </div>
</div>

<button type="button" class="vh-fab" id="vhFab" aria-label="Einwurf: etwas eintragen"><span aria-hidden="true">+</span> Einwurf</button>
<div class="modal-back" id="vhModal"></div>
<div class="toast" id="toast"></div>
<script src="/assets/core.js?v=35"></script>
<script src="/assets/game.js?v=35"></script>
<script src="/assets/eggs.js?v=35" defer></script>
<script>
/* V31 · Vorhaben: eine Seite, drei Ansichten (Woche, Board, Liste), die Akte rechts (ab 1024 px) oder als Blatt.
   Liest vorhaben_list und vorhaben_get, schreibt über vorhaben_save, punkt_*, verlauf_status, vorhaben_verknuepfen,
   vorhaben_abschliessen und vorhaben_wiedereroeffnen (21.10.2026: Erledigt, Filter „Erledigt“, Wieder öffnen).
   Ansicht und Filter stehen in localStorage gf_vh_view und gf_vh_filter, die Akte im Link (?v=<slug>&tab=verlauf). */
const $=s=>document.querySelector(s);
let DATA=null, ERL=null, ERL_GESAMT=0, ERL_FEHLER="", LADE_LAUF=0, ERL_LAUF=0, AKTE=null, AKTE_SLUG=null, TAB="prozess", VL_FILTER="alle", AKTE_LAUF=0, GELOEST=null, ENTWURF={}, SPEICHERT=null;
let VIEW=(()=>{ try{ const v=localStorage.getItem("gf_vh_view"); return ["woche","board","liste"].includes(v)?v:"woche"; }catch(e){ return "woche"; } })();
let FILTER=(()=>{ try{ const v=localStorage.getItem("gf_vh_filter"); return ["alle","mir","bewegt","konflikte","erledigt"].includes(v)?v:"alle"; }catch(e){ return "alle"; } })();
const Q=new URLSearchParams(location.search);
if(["mir","erledigt"].includes(Q.get("filter"))) FILTER=Q.get("filter");
if(Q.get("view") && ["woche","board","liste"].includes(Q.get("view"))) VIEW=Q.get("view");
if(Q.get("tab")==="verlauf") TAB="verlauf";

/* ---------- Kalender (Berliner Tage als JJJJ-MM-TT, gerechnet in UTC wie gfAddDays) ---------- */
const dTag=d=>new Date(d+"T00:00:00Z");
const montag=d=>{ const x=dTag(d); return gfAddDays(d, -((x.getUTCDay()+6)%7)); };
function kw(d){ const x=dTag(d); const dn=(x.getUTCDay()+6)%7; x.setUTCDate(x.getUTCDate()-dn+3); const j=new Date(Date.UTC(x.getUTCFullYear(),0,4)); return 1+Math.round(((x-j)/86400000-3+((j.getUTCDay()+6)%7))/7); }
const kurz=d=>dTag(d).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",timeZone:"UTC"});
const heute=()=>DATA?.heute || new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Berlin"});

/* ---------- Auswahl ---------- */
function ich(){ return gfVhIch(); }
function hatKonflikt(v){ return !!(v.konflikt||"").trim() || v.zustand==="ueberfaellig" || v.zustand==="ball_fehlt"; }
function passt(v, f=FILTER){
  if(f==="mir") return gfVhMir(v, ich());
  if(f==="bewegt") return v.zustand==="bewegt";
  if(f==="konflikte") return hatKonflikt(v);
  return true;
}
function sichtbar(){ return FILTER==="erledigt" ? (ERL||[]) : (DATA?.vorhaben||[]).filter(v=>passt(v)); }
const offenZu=v=>["erledigt","archiviert"].includes(v?.status);
/* Berliner Kalendertag eines Zeitpunkts als JJJJ-MM-TT */
const berlinTag=ts=>ts?new Date(ts).toLocaleDateString("sv-SE",{timeZone:"Europe/Berlin"}):"";
function vvk(v){ const s=v.saison; if(!s) return null; return s.vvk_start || (/vvk/i.test(s.item_title||"") ? s.item_von : null); }

/* ---------- Kopf, Steuerung ---------- */
function renderKopf(){
  const m=DATA.metaphase; $("#vhMeta").textContent=m?`Metaphase · ${m.title}`:"Vorhaben der Geschäftsführung";
  const alle=DATA.vorhaben, z=k=>alle.filter(v=>v.ball===k).length;
  const stand=new Date(DATA.stand).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  const teile=[`Stand ${stand}`, `${alle.length} Vorhaben`, `${z("alex")} Bälle bei Alex`, `${z("lea")} bei Lea`];
  if(z("offen")) teile.push(`${z("offen")} ohne Ball`);
  for(const a of DATA.abwesenheiten||[]){
    const bis=a.bis||a.bis_geschaetzt;
    teile.push(a.status==="aktiv" ? `${a.person} abwesend${bis?" bis "+gfVhTag(bis):""}` : `${a.person} abwesend ab ${gfVhTag(a.von)}`);
  }
  $("#vhLage").textContent=teile.join(" · ");
  const n=DATA.einwuerfe_offen||0, w=$("#vhWarte");
  w.hidden=!n; w.innerHTML=n?`<span class="zst warn"><i aria-hidden="true">●</i>${n===1?"1 Einwurf wartet":n+" Einwürfe warten"}</span><span>auf Übernahme oder Zuordnung. Öffnen</span>`:"";
}
function renderSteuer(){
  const views=[["woche","Woche"],["board","Board"],["liste","Liste"]];
  $("#vhViews").innerHTML=views.map(([k,l])=>`<button type="button" class="chip${VIEW===k?" on":""}" aria-pressed="${VIEW===k}" data-view="${k}">${l}</button>`).join("");
  const alle=DATA.vorhaben, filter=[["alle","Alle"],["mir","Bei mir"],["bewegt","Bewegt"],["konflikte","Konflikte"],["erledigt","Erledigt"]];
  const zahl=k=>k==="erledigt"?(ERL?" · "+ERL.length:""):" · "+alle.filter(v=>passt(v,k)).length;
  $("#vhFilter").innerHTML=filter.map(([k,l])=>`<button type="button" class="chip${FILTER===k?" on":""}" aria-pressed="${FILTER===k}" data-filter="${k}">${l}${zahl(k)}</button>`).join("");
}
$("#vhViews").addEventListener("click",e=>{ const b=e.target.closest("[data-view]"); if(!b) return; VIEW=b.dataset.view; try{ localStorage.setItem("gf_vh_view",VIEW); }catch(x){} renderSteuer(); renderMain(); });
/* Filter merken (localStorage) und im Link nachführen: „Bei mir“ und „Erledigt“ stehen als ?filter= im Link (teilbar),
   die übrigen nehmen den Parameter heraus, damit Neuladen nicht auf einen alten Filter zurückspringt. */
function filterSetzen(f){ FILTER=f; try{ localStorage.setItem("gf_vh_filter",FILTER); }catch(x){}
  const u=new URL(location.href); if(["mir","erledigt"].includes(f)) u.searchParams.set("filter",f); else u.searchParams.delete("filter"); history.replaceState(null,"",u); }
$("#vhFilter").addEventListener("click",async e=>{ const b=e.target.closest("[data-filter]"); if(!b) return; filterSetzen(b.dataset.filter); renderSteuer(); renderMain();
  if(FILTER==="erledigt"){ await ladenErledigt(); if(FILTER==="erledigt"){ renderSteuer(); renderMain(); } } });

/* ---------- Karten ---------- */
function marken(v, wocheVon){
  const m=[]; const f=gfVhFrist(v), h=heute();
  if(v.zustand==="ueberfaellig") m.push(["warn","⚠","überfällig"]);
  if(v.zustand==="ball_fehlt") m.push(["crit","⚠","Ball fehlt"]);
  if((v.konflikt||"").trim()) m.push(["warn","⚠",v.konflikt.trim()]);
  const s=vvk(v); if(v.gruppe==="launch" && s && wocheVon && s>=wocheVon && s<=gfAddDays(wocheVon,6)) m.push(["action","★","Launch "+gfVhTag(s)]);
  if(v.status==="pausiert") m.push(["","▬","pausiert"]);
  return m;
}
const markeHtml=m=>`<span class="zst${m[0]?" "+m[0]:""} vh-marke" title="${gfEsc(m[2])}"><i aria-hidden="true">${m[1]}</i>${gfEsc(m[2].length>48?m[2].slice(0,46)+"…":m[2])}</span>`;
function karte(v, opts={}){
  const f=gfVhFrist(v), ms=marken(v, opts.wocheVon), on=AKTE_SLUG===v.slug;
  const tag=f ? (f<heute() ? "seit "+kurz(f) : gfVhTag(f)) : "ohne Datum";
  const ton=v.zustand==="ball_fehlt"?" crit":(v.zustand==="ueberfaellig"||(v.konflikt||"").trim())?" warn":ms.some(x=>x[1]==="★")?" key":"";
  return `<article class="vh-card${ton}${on?" on":""}" data-slug="${gfEsc(v.slug)}"${opts.drag?` draggable="true"`:""}>
    <button type="button" class="vh-open" data-open="${gfEsc(v.slug)}" aria-label="${gfEsc(v.title)}: Akte öffnen">
      <span class="vh-c-kopf"><b>${gfEsc(tag)}</b>${ms.length?ms.map(markeHtml).join(""):""}</span>
      <span class="vh-c-t">${gfEsc(v.title)}</span>
      ${v.naechster_schritt?`<span class="vh-c-n">→ ${gfEsc(v.naechster_schritt)}</span>`:`<span class="vh-c-n leer">kein nächster Schritt</span>`}
      <span class="vh-c-fuss">${gfVhBall(v)}<span class="vh-c-p">${v.punkte_erledigt} von ${v.punkte_gesamt}</span></span>
    </button>
    ${opts.weitergeben?`<button type="button" class="btn btn-sm btn-ghost vh-weiter" data-ball="${gfEsc(v.slug)}">Ball weitergeben</button>`:""}
  </article>`;
}

/* ---------- Woche ---------- */
function abwesendIn(von, bis){ return (DATA.abwesenheiten||[]).filter(a=>{ const e=a.bis||a.bis_geschaetzt||gfAddDays(a.von,13); return a.von<=bis && e>=von; }); }
function band(a, von){
  const e=a.bis||a.bis_geschaetzt; const vt=a.vertretung_standard?` · Vertretung ${a.vertretung_standard}`:"";
  if(a.von>=von) return `Ab ${gfVhTag(a.von)} ist ${a.person} abwesend${e?" bis "+gfVhTag(e):""}${vt}`;
  return `${a.person} abwesend${e?" bis "+gfVhTag(e):""}${vt}`;
}
function renderWoche(liste){
  const h=heute(), m0=montag(h), reihen=[];
  const ueber=liste.filter(v=>{ const f=gfVhFrist(v); return f && f<h; });
  if(ueber.length) reihen.push({ kopf:"Überfällig", sub:"Frist vorbei", tag:"", ton:"warn", items:ueber, von:null });
  for(let i=0;i<9;i++){
    const von=gfAddDays(m0,i*7), bis=gfAddDays(von,6);
    const its=liste.filter(v=>{ const f=gfVhFrist(v); return f && f>=h && f>=von && f<=bis; });
    reihen.push({ kopf:"KW "+kw(von), sub:`${kurz(von)} bis ${kurz(bis)}`, tag:i===0?"diese Woche":i===1?"nächste Woche":"", ton:i===0?"jetzt":"", items:its, von, baender:abwesendIn(von,bis).map(a=>band(a,von)) });
  }
  const ende=gfAddDays(m0,62);
  reihen.push({ kopf:"Später", sub:"ab "+kurz(gfAddDays(ende,1)), items:liste.filter(v=>{ const f=gfVhFrist(v); return f && f>ende; }) });
  reihen.push({ kopf:"Ohne Datum", sub:"laufend", items:liste.filter(v=>!gfVhFrist(v)) });
  const sort=(a,b)=>(gfVhFrist(a)||"9").localeCompare(gfVhFrist(b)||"9")||a.sort-b.sort;
  return `<div class="vh-woche">${reihen.map(r=>{
    const leer=!r.items.length && !(r.baender||[]).length;
    return `<section class="vh-wz${r.ton?" "+r.ton:""}${leer?" leer":""}" aria-label="${gfEsc(r.kopf)}">
      <div class="vh-wz-k"><b>${gfEsc(r.kopf)}</b><span>${gfEsc(r.sub||"")}</span>${r.tag?`<em>${gfEsc(r.tag)}</em>`:""}</div>
      <div class="vh-wz-i">${(r.baender||[]).map(b=>`<div class="vh-band"><span aria-hidden="true">▬</span> ${gfEsc(b)}</div>`).join("")}
        ${r.items.length?`<div class="vh-cards">${r.items.sort(sort).map(v=>karte(v,{wocheVon:r.von})).join("")}</div>`:(leer?`<span class="vh-nichts">nichts fällig</span>`:"")}</div>
    </section>`; }).join("")}</div>`;
}

/* ---------- Board ---------- */
function renderBoard(liste){
  const h=heute(), in14=gfAddDays(h,14);
  return `<div class="vh-board-x"><div class="vh-board">${GF_VH_BALL.map(([k,l])=>{
    const its=liste.filter(v=>v.ball===k).sort((a,b)=>(gfVhFrist(a)||"9").localeCompare(gfVhFrist(b)||"9"));
    const bald=its.filter(v=>{ const f=gfVhFrist(v); return f && f<=in14; }).length;
    const voll=its.length>5;
    return `<section class="vh-col${voll?" voll":""}${k==="offen"?" ohne":""}" data-col="${k}" aria-label="${gfEsc(l)}, ${its.length} Vorhaben">
      <div class="vh-col-k">${gfVhBallAv(k,"")}<b>${gfEsc(l)}</b><span class="n">${its.length}</span></div>
      ${voll?`<div class="vh-col-w">${markeHtml(["warn","⚠",`${its.length} Vorhaben, ${bald} mit Frist in 14 Tagen`])}</div>`:""}
      <div class="vh-col-i">${its.map(v=>karte(v,{drag:true,weitergeben:true})).join("")||`<span class="vh-nichts">leer</span>`}</div>
    </section>`; }).join("")}</div></div>`;
}

/* ---------- Liste ---------- */
function renderListe(liste){
  const gruppen=Object.keys(GF_VH_GRUPPE).map(g=>[g, liste.filter(v=>v.gruppe===g)]).filter(([,its])=>its.length);
  return `<div class="vh-liste-x"><div class="vh-liste">
    <div class="vh-l-kopf" aria-hidden="true"><span>Zustand</span><span>Vorhaben und Stand</span><span>Ball</span><span>Nächster Schritt</span><span>Frist</span><span>Punkte</span></div>
    ${gruppen.map(([g,its])=>`<section aria-label="${gfEsc(GF_VH_GRUPPE[g])}"><h3 class="vh-l-g">${gfEsc(GF_VH_GRUPPE[g])} <span>${its.length}</span></h3>
      ${its.map(v=>{ const f=gfVhFrist(v); return `<div class="vh-l-zeile"><button type="button" class="vh-l-fertig" data-fertig="${gfEsc(v.slug)}" aria-label="${gfEsc(v.title)}: als erledigt abschließen" title="Als erledigt abschließen"><i aria-hidden="true">✓</i></button><button type="button" class="vh-l-z${AKTE_SLUG===v.slug?" on":""}" data-open="${gfEsc(v.slug)}">
        <span>${gfVhZustand(v.zustand)}</span>
        <span class="vh-l-t"><b>${gfEsc(v.title)}</b><small>${gfEsc(v.stand||"ohne Stand")}</small></span>
        <span>${gfVhBall(v)}</span>
        <span class="vh-l-n">${gfEsc(v.naechster_schritt||"")}</span>
        <span>${f?gfFrist(f):(v.frist_text?gfEsc(v.frist_text):gfZustand("offen","ohne Frist"))}</span>
        <span class="vh-l-p">${v.punkte_erledigt} von ${v.punkte_gesamt}</span>
      </button></div>`; }).join("")}</section>`).join("")}
  </div></div>`;
}

/* ---------- Erledigt: in jeder Ansicht dieselbe ruhige Liste, zuletzt erledigte zuerst (90 Tage) ---------- */
function renderErledigt(liste){
  const grenze=gfAddDays(heute(),-90), neu=liste.filter(v=>berlinTag(v.erledigt_am)>=grenze), alt=liste.filter(v=>berlinTag(v.erledigt_am)<grenze);
  return `<p class="vh-sync vh-erl-h">Zuletzt erledigte zuerst. Öffnen zeigt die Akte mit „Wieder öffnen“.</p>
    ${neu.length?`<h3 class="vh-l-g">Letzte 90 Tage <span>${neu.length}</span></h3>${erledigtZeilen(neu)}`:""}
    ${alt.length?`<h3 class="vh-l-g">Früher <span>${alt.length}</span></h3>${erledigtZeilen(alt)}`:""}
    ${ERL_GESAMT?`<p class="vh-sync">Gezeigt sind die ${liste.length} zuletzt erledigten von ${ERL_GESAMT}.</p>`:""}`;
}
function erledigtZeilen(liste){
  return `<div class="vh-erl">${liste.map(v=>`<button type="button" class="vh-erl-z${AKTE_SLUG===v.slug?" on":""}" data-open="${gfEsc(v.slug)}">
      <span class="vh-erl-d"><span class="zst"><i aria-hidden="true">✓</i>${gfEsc("erledigt "+gfVhTag(berlinTag(v.erledigt_am)))}</span></span>
      <span class="vh-erl-t"><b>${gfEsc(v.title)}</b><small>${gfEsc(v.ergebnis||"ohne Ergebnissatz")}</small></span>
      <span class="vh-erl-b">${gfVhBall(v)}</span>
    </button>`).join("")}</div>`;
}
function renderMain(){
  if(FILTER==="erledigt" && ERL_FEHLER){ $("#vhMain").innerHTML=`<div class="empty soft">Die erledigten Vorhaben ließen sich nicht laden: ${gfEsc(ERL_FEHLER)}. <button type="button" class="btn btn-sm btn-ghost" data-erl-neu>Noch einmal</button></div>`; return; }
  if(FILTER==="erledigt" && !ERL){ $("#vhMain").innerHTML=`<div class="loading">lädt …</div>`; return; }
  const liste=sichtbar();
  if(!liste.length){ $("#vhMain").innerHTML=`<div class="empty soft">${({mir:"Im Filter „Bei mir“ steht gerade nichts.",bewegt:"Im Filter „Bewegt“ steht gerade nichts.",konflikte:"Im Filter „Konflikte“ steht gerade nichts.",erledigt:"In den letzten 90 Tagen wurde nichts erledigt."})[FILTER]||"Noch keine Vorhaben."} ${FILTER!=="alle"?`<button type="button" class="btn btn-sm btn-ghost" data-filter-reset>Alle zeigen</button>`:""}</div>`; return; }
  $("#vhMain").innerHTML= FILTER==="erledigt" ? renderErledigt(liste) : VIEW==="board" ? renderBoard(liste) : VIEW==="liste" ? renderListe(liste) : renderWoche(liste);
  gfStagger($("#vhMain"), ".vh-card,.vh-l-z,.vh-erl-z");
}
$("#vhMain").addEventListener("click",e=>{
  if(e.target.closest("[data-erl-neu]")){ ERL_FEHLER=""; renderMain(); ladenErledigt().then(()=>{ renderSteuer(); renderMain(); }); return; }
  if(e.target.closest("[data-filter-reset]")){ filterSetzen("alle"); renderSteuer(); renderMain(); return; }
  const w=e.target.closest("[data-ball]"); if(w){ const v=DATA.vorhaben.find(x=>x.slug===w.dataset.ball); if(v) ballWaehlen(v); return; }
  const fe=e.target.closest("[data-fertig]"); if(fe){ const v=DATA.vorhaben.find(x=>x.slug===fe.dataset.fertig); if(v) abschliessenBlatt(v); return; }
  const o=e.target.closest("[data-open]"); if(o) oeffneAkte(o.dataset.open);
});

/* ---------- Ball weitergeben: Ziehen im Board, Knopf auf der Karte, Chips in der Akte ---------- */
let ZIEHT=null;
$("#vhMain").addEventListener("dragstart",e=>{ const c=e.target.closest(".vh-card[draggable]"); if(!c) return; ZIEHT=c.dataset.slug; e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",ZIEHT); }catch(x){} c.classList.add("zieht"); });
$("#vhMain").addEventListener("dragend",e=>{ const c=e.target.closest(".vh-card"); if(c) c.classList.remove("zieht"); document.querySelectorAll(".vh-col.ziel").forEach(x=>x.classList.remove("ziel")); });
$("#vhMain").addEventListener("dragover",e=>{ const col=e.target.closest(".vh-col"); if(!col||!ZIEHT) return; e.preventDefault(); document.querySelectorAll(".vh-col.ziel").forEach(x=>x!==col&&x.classList.remove("ziel")); col.classList.add("ziel"); });
$("#vhMain").addEventListener("drop",e=>{ const col=e.target.closest(".vh-col"); if(!col||!ZIEHT) return; e.preventDefault(); col.classList.remove("ziel");
  const v=DATA.vorhaben.find(x=>x.slug===ZIEHT); ZIEHT=null; if(!v || v.ball===col.dataset.col) return;
  if(col.dataset.col==="team"||col.dataset.col==="extern") ballWaehlen(v, col.dataset.col); else ballSetzen(v, col.dataset.col, null); });

function ballWaehlen(v, vorwahl){
  const m=$("#vhModal");
  m.innerHTML=`<div class="modal vh-dlg" role="dialog" aria-modal="true" aria-labelledby="vhBallH">
    <div class="modal-h"><h3 id="vhBallH">Ball weitergeben</h3><button type="button" class="icon-btn" data-x aria-label="Schließen">✕</button></div>

  document.querySelectorAll(`[data-slug="${CSS.escape(slug)}"].vh-card,.vh-l-z[data-open="${CSS.escape(slug)}"],.vh-erl-z[data-open="${CSS.escape(slug)}"]`).forEach(x=>x.classList.add("on"));

function quellenText(q){ const l=(Array.isArray(q)?q:[]).filter(x=>x&&x.quelle);
  if(!l.length) return "Noch kein Abgleich eingetragen.";

/* Angehängte Zahlen im Abschlusseintrag („ · 2 Punkte abgehakt, 1 Thema archiviert“, früher in Klammern), wie vhErgebnis im Backend. */
const VH_ZAHLEN=/\s*(?:·\s*|\()(?:\d+ (?:Punkte?) abgehakt|\d+ (?:Thema|Themen) archiviert)(?:, \d+ (?:Thema|Themen) archiviert)?\)?\s*$/;
/* Abschlusseintrag im Verlauf („Erledigt: …“, von Cowork auch „Vorhaben erledigt: …“): Datum und Ergebnissatz. */

  const e=(d.verlauf||[]).find(x=>x.art==="entscheidung" && x.status==="bestaetigt" && /^(Vorhaben )?erledigt:/i.test(x.text||""));

}

  if(e.target.closest("[data-einwurf-akte]")){ if(!offenZu(AKTE.vorhaben)) einwurf({ vorhaben_id:AKTE.vorhaben.id }); return; }
  const bc=e.target.closest("[data-ball-akte]"); if(bc){ const v=AKTE.vorhaben; if(bc.dataset.ballAkte==="team"||bc.dataset.ballAkte==="extern") ballWaehlen(v, bc.dataset.ballAkte); else if(bc.dataset.ballAkte!==v.ball) await ballSetzen(v, bc.dataset.ballAkte, null); if(AKTE_SLUG) oeffneAkte(AKTE_SLUG,{tabKeep:true,still:true}); return; }
  const vs=e.target.closest("[data-vstatus]"); if(vs){ vs.disabled=true;
    try{ const r=await gfApi("verlauf_status",{ id:vs.dataset.id, status:vs.dataset.vstatus, by:gfWho() }); gfToast(vs.dataset.vstatus==="bestaetigt"?(r.angewendet?.geaendert?"Übernommen, Punkt abgehakt":"Übernommen"):"Verworfen"); await oeffneAkte(AKTE_SLUG,{tabKeep:true,still:true}); laden(true); }
    catch(err){ vs.disabled=false; gfToast("Nicht gespeichert: "+(err.message||"Verbindung")); } return; }
  const lo=e.target.closest("[data-loesen]"); if(lo){ lo.disabled=true;

    catch(err){ lo.disabled=false; gfToast("Nicht gespeichert: "+(err.message||"Verbindung")); if(/inzwischen/.test(err.message||"")) oeffneAkte(AKTE_SLUG,{tabKeep:true,still:true}); } return; }

  const vst=e.target.closest("[data-vstand]"); if(vst){ const ev=AKTE.verlauf.find(x=>x.id===vst.dataset.vstand), p=ev&&vorschlagPunkt(ev); if(!p) return;
    /* Neuer Stand steht im Text nach „jetzt so steht:“ (docs/ABGLEICH-VORHABEN.md, Abschnitt F); die Person prüft ihn im Formular. */

function punktForm(p, vor={}){
  const box=p ? (()=>{ const li=document.querySelector(`.vh-punkt[data-punkt="${p.id}"]`); let f=li.querySelector(".vh-punkt-form"); if(!f){ f=document.createElement("div"); f.className="vh-punkt-form"; li.appendChild(f); } return f; })() : $("#vhPunktNeu");
  box.hidden=false;
  box.innerHTML=`<form class="vh-pform">
    <label class="vh-fld">Punkt<input name="titel" required maxlength="300" value="${gfEsc(p?.titel||"")}"></label>
    ${vor.vorschlag?`<p class="vh-dlg-t">Vorschlag des Abgleichs. Bisher: <b>${gfEsc(p.stand||"kein Stand")}</b>. Neuen Stand prüfen, dann speichern; Stand und Vorschlag werden zusammen übernommen.</p>`:""}
    ${p?`<label class="vh-fld">Stand<input name="stand" maxlength="1000" value="${gfEsc(vor.stand!==undefined&&vor.stand!==""?vor.stand:(p.stand||""))}"></label>`:""}
    <div class="vh-pform-z"><label class="vh-fld">Wer<input name="wer" maxlength="120" value="${gfEsc(p?.wer||"")}"></label>
    <label class="vh-fld">Frist<input name="frist" type="date" value="${gfEsc(p?.frist||"")}"></label></div>
    <div class="vh-pform-a"><button type="submit" class="btn btn-sm btn-primary">${p?"Speichern":"Hinzufügen"}</button><button type="button" class="btn btn-sm btn-ghost" data-pform-x>Abbrechen</button>${p?`<button type="button" class="btn btn-sm btn-ghost" data-pform-del style="margin-left:auto">Punkt löschen</button>`:""}</div>
  </form>`;
  const form=box.querySelector("form");
  /* Beim Stand-Vorschlag wird nur der Stand übernommen; die übrigen Felder stehen zur Ansicht da. */
  if(vor.vorschlag){ for(const n of ["titel","wer","frist"]) { form[n].readOnly=true; form[n].setAttribute("aria-readonly","true"); } form.stand.focus(); } else form.titel.focus();
  form.querySelector("[data-pform-x]").onclick=()=>{ box.innerHTML=""; if(!p) box.hidden=true; };
  const del=form.querySelector("[data-pform-del]");
  /* Webapp Standard B-06, G-04: Löschen nennt Gegenstand und Folge, bevor es endgültig wirkt (vorher ohne Rückfrage). */
  if(del) del.onclick=async()=>{ if(!confirm(`Punkt „${p.titel}“ endgültig löschen? Das lässt sich nicht rückgängig machen. Hat der Punkt schon Verlauf, wird das Löschen abgelehnt; setze ihn dann auf erledigt.`)) return; try{ await gfApi("punkt_delete",{ id:p.id, by:gfWho() }); gfToast("Punkt gelöscht"); await oeffneAkte(AKTE_SLUG,{tabKeep:true,still:true}); laden(true); }catch(err){ gfToast(err.message||"Nicht gelöscht"); } };
  form.onsubmit=async ev=>{ ev.preventDefault();
    const daten={ titel:form.titel.value.trim(), wer:form.wer.value.trim(), frist:form.frist.value||null };
    if(p) daten.stand=form.stand.value.trim();
    if(!daten.titel) return;
    /* Beim Ändern nur die geänderten Felder, jeweils mit dem Wert, den die Person gesehen hat: ändert Lea gleichzeitig
       ein anderes Feld, bleibt es stehen; ändert sie dasselbe, kommt 409 statt eines stillen Überschreibens. */
    if(vor.vorschlag){
      try{ await gfApi("vorschlag_stand",{ id:vor.vorschlag, stand:(daten.stand||"").trim(), expect_stand:p.stand??null, by:gfWho() }); gfToast("Stand übernommen"); await oeffneAkte(AKTE_SLUG,{tabKeep:true,still:true}); laden(true); }
      catch(err){ gfToast("Nicht übernommen: "+(err.message||"Verbindung")); }
      return; }
    let nutz;
    if(p){ nutz={ id:p.id, expect:{}, by:gfWho() };
      for(const k of Object.keys(daten)){ const alt=p[k]??null, neu=daten[k]===""?null:daten[k]; if((alt||null)!==(neu||null)){ nutz[k]=daten[k]; nutz.expect[k]=alt; } }
      if(!Object.keys(nutz.expect).length){ box.innerHTML=""; return; } }
    else nutz={ vorhaben_id:AKTE.vorhaben.id, ...daten, by:gfWho() };
    try{ await gfApi("punkt_save", nutz);
      gfToast(p?"Punkt gespeichert":"Punkt hinzugefügt"); await oeffneAkte(AKTE_SLUG,{tabKeep:true,still:true}); laden(true); }
    catch(err){ gfToast("Nicht gespeichert: "+(err.message||"Verbindung")); }
  };
}

/* ---------- Abschließen, Rückgängig, Wieder öffnen, Pausieren, Archivieren (21.10.2026) ----------
   Zwei Fingertipps: „✓ Erledigt“ (Akte) oder der Kreis in der Liste öffnet das Blatt, „Abschließen“ schließt ab.
   Ergebnissatz optional; offene Punkte werden vorbelegt mit abgehakt, verknüpfte Themen bleiben vorbelegt offen
   (bei XCeed laufen Themen weiter). Danach 10 Sekunden „Rückgängig“ mit genau den geänderten Punkten und Themen. */
function menu(auf){
  const m=$("#vhMenu"), k=document.querySelector("[data-menu]"); if(!m||!k) return;
  m.hidden=!auf; k.setAttribute("aria-expanded", String(!!auf));
  if(auf) m.querySelector("button")?.focus();
}
document.addEventListener("click",e=>{ if(!e.target.closest(".vh-menu-w")) menu(false); });
function abschliessenBlatt(v){
  const m=$("#vhModal"), np=Math.max(0,(v.punkte_gesamt||0)-(v.punkte_erledigt||0)), nt=v.themen_offen||0;
  m.classList.add("vh-blatt-back");
  m.innerHTML=`<div class="modal vh-dlg vh-blatt" role="dialog" aria-modal="true" aria-labelledby="vhErlH">
    <div class="modal-h"><h3 id="vhErlH">Vorhaben abschließen</h3><button type="button" class="icon-btn" data-x aria-label="Schließen">✕</button></div>
    <div class="vh-dlg-b">
      <p class="vh-dlg-t"><b>${gfEsc(v.title)}</b></p>
      <label class="vh-fld">Ergebnis in einem Satz (optional)<input type="text" id="vhErlSatz" maxlength="300" placeholder="z. B. Vertrag unterschrieben am …"></label>
      ${np?`<label class="vh-haken"><input type="checkbox" id="vhErlPunkte" checked> Offene Punkte (${np}) mit abhaken</label>`:""}
      ${nt?`<label class="vh-haken"><input type="checkbox" id="vhErlThemen"> Verknüpfte Themen im Board (${nt}) archivieren</label>`:""}
      <div class="vh-ew-fehler" id="vhErlFehler" role="alert" hidden></div>
    </div>
    <div class="modal-f"><button type="button" class="btn btn-brand" data-x>Abbrechen</button><button type="button" class="btn btn-primary" id="vhErlOk" style="margin-left:auto"><span aria-hidden="true">✓</span> Abschließen</button></div>
  </div>`;
  m.classList.add("open"); const frei=gfModalAuf(m);
  let laeuft=false;
  const zu=()=>{ if(laeuft) return; m.classList.remove("open","vh-blatt-back"); m.innerHTML=""; m.onkeydown=null; m.onclick=null; frei(); };
  m.querySelectorAll("[data-x]").forEach(b=>b.onclick=zu); m.onclick=e=>{ if(e.target===m) zu(); };
  m.onkeydown=e=>{ if(e.key==="Escape"){ e.stopPropagation(); zu(); } };
  $("#vhErlOk").onclick=async()=>{
    if(laeuft) return; laeuft=true;
    const ok=$("#vhErlOk"); ok.disabled=true;
    const nutz={ id:v.id, by:gfWho(), ergebnis:$("#vhErlSatz").value.trim()||undefined,
      punkte_mit:!!$("#vhErlPunkte")?.checked, themen_mit:!!$("#vhErlThemen")?.checked, expect:v.updated_at||undefined };
    try{
      const d=await gfApi("vorhaben_abschliessen", nutz);
      laeuft=false; zu();
      if(AKTE_SLUG===v.slug) schliesseAkte();
      rueckgaengigHinweis(v, d);
      await laden(true);
    }catch(err){ laeuft=false; ok.disabled=false;
      /* Konflikt (inzwischen geändert oder schon erledigt): das Blatt kennt einen alten Stand, also zu, neu laden, Hinweis.
         Bei einer Störung bleibt es mit dem eingetippten Satz offen für einen zweiten Versuch. */
      if(/neu laden|inzwischen|schon/i.test(err.message||"")){ zu(); gfToast("Nicht abgeschlossen: "+err.message); await laden(true); if(AKTE_SLUG===v.slug) oeffneAkte(AKTE_SLUG,{tabKeep:true,still:true}); return; }
      const f=$("#vhErlFehler"); f.hidden=false; f.textContent="Nicht abgeschlossen: "+(err.message||"Verbindung"); }
  };
  setTimeout(()=>$("#vhErlOk")?.focus(),40);
}
let RUECK_T=null;
function rueckgaengigHinweis(v, d){
  let h=$("#vhRueck");
  if(!h){ h=document.createElement("div"); h.id="vhRueck"; h.className="toast vh-rueck"; h.setAttribute("role","status"); document.body.appendChild(h); }
  const teile=[d.punkte?`${d.punkte} ${d.punkte===1?"Punkt":"Punkte"} abgehakt`:"", d.themen?`${d.themen} ${d.themen===1?"Thema":"Themen"} archiviert`:""].filter(Boolean).join(", ");
  h.innerHTML=`<span>${gfEsc(v.title)} erledigt${teile?" · "+gfEsc(teile):""}</span><button type="button" class="btn btn-sm btn-ghost" id="vhRueckK">Rückgängig</button>`;
  h.classList.add("show"); clearTimeout(RUECK_T);
  const weg=()=>{ clearTimeout(RUECK_T); h.classList.remove("show"); h.innerHTML=""; };
  RUECK_T=setTimeout(weg, 10000);
  $("#vhRueckK").onclick=async()=>{
    const k=$("#vhRueckK"); if(k) k.disabled=true; clearTimeout(RUECK_T);
    try{ await gfApi("vorhaben_wiedereroeffnen",{ id:v.id, by:gfWho(), rueckgaengig:d.rueckgaengig }); weg(); gfToast(`${v.title} ist wieder offen`); await laden(true); }
    catch(err){
      /* Gilt der Abschluss nicht mehr (409, inzwischen geändert), ist Rückgängig vorbei. Bei einer Störung bleibt der Hinweis
         mit Wert stehen, damit ein zweiter Versuch Punkte und Themen noch zurückholt. */
      if(/neu laden|nicht abgeschlossen|letzten Abschluss/i.test(err.message||"")){ weg(); gfToast("Nicht rückgängig gemacht: "+err.message); await laden(true); return; }
      const sp=h.querySelector("span"); if(sp) sp.textContent=`Rückgängig hat nicht geklappt (${err.message||"Verbindung"}). Noch einmal?`;
      if(k) k.disabled=false; RUECK_T=setTimeout(weg, 30000);
    }
  };
}

/* ---------- Übergabe (31d) ----------
   Feierabend oder Schichtende: Bälle bei mir je Vorhaben an die andere Person, bleibt oder GF, mit Notiz (schicht_uebergabe).
   Urlaub oder Krank: Abwesenheit anlegen oder die laufende nehmen (absence_set baut den Korb), die Vorhaben-Zeilen des Korbs
   oben mit „<andere> übernimmt“, „Ruht bis <Rückkehr>“, „Team“; gespeichert über handover_set_many. Den Rest des Korbs
   (Themen, Kandidaten, Termine) entscheidet die Übergabeseite. */
async function vhUebergabe(){
  const m=$("#vhModal"); m.classList.add("vh-ew-back");
  const ich=gfWho(), andere=gfVhAndere(), meinBall=gfVhIch(), heute=DATA?.heute||new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Berlin"});

  const meine=()=>(DATA?.vorhaben||[]).filter(v=>v.ball===meinBall).sort((a,b)=>(gfVhFrist(a)||"9999").localeCompare(gfVhFrist(b)||"9999"));
  /* Alle geplanten und laufenden Abwesenheiten der Person; bei mehreren wählt sie aus, statt dass die erste gewinnt. */
  const laufende=()=>(DATA?.abwesenheiten||[]).filter(a=>gfWhoNorm(a.person)===ich&&(a.status==="geplant"||a.status==="aktiv"));
  const rueck=a=>gfVhTag(gfAddDays(a.bis||a.bis_geschaetzt||gfAddDays(a.von,13),1));
  function chips(id, opts, cur, label){ return `<div class="fchips compact" role="group" aria-label="${gfEsc(label)}">${opts.map(([k,l])=>`<button type="button" class="chip${cur===k?" on":""}" aria-pressed="${cur===k}" data-wahl="${gfEsc(id)}" data-v="${k}">${gfEsc(l)}</button>`).join("")}</div>`; }
  function render(){

    if(!S.anlass){
      body=`<p class="vh-dlg-t">Wofür übergibst du?</p>
        <div class="vh-ue-anlass">${[["schicht","Feierabend oder Schichtende","Bälle für heute weitergeben, keine Abwesenheit"],["urlaub","Urlaub","Abwesenheit mit Vertretung, Korb und Rückgabe"],["krank","Krank","Ab sofort weg, Korb und Rückgabe"]].map(([k,l,h])=>`<button type="button" class="vh-ue-a" data-anlass="${k}"><b>${l}</b><span>${h}</span></button>`).join("")}</div>`;
      fuss=`<button type="button" class="btn btn-brand" data-ue-x>Abbrechen</button>`;
    } else if(S.anlass==="schicht"){
      unter="Feierabend oder Schichtende";
      const l=meine();
      /* Vorauswahl „bleibt bei mir“: weitergegeben wird nur, was jemand ausdrücklich wählt, nie alles auf einen Klick. */
      body=l.length?`<p class="vh-dlg-t">${l.length} ${l.length===1?"Vorhaben liegt":"Vorhaben liegen"} bei dir. Wähle, was ${gfEsc(andere)} übernimmt.</p>${l.map(v=>{ const w=S.wahl[v.id]||"bleibt"; return `<div class="vh-ue-z">

          ${chips(v.id,[["andere",andere+" übernimmt"],["bleibt","bleibt bei mir"],["gf","GF gemeinsam"]],w,"Ball für "+v.title)}
          <input class="vh-ue-n" data-notiz="${v.id}" maxlength="300" placeholder="Notiz für ${gfEsc(andere)} (optional)" aria-label="Notiz zu ${gfEsc(v.title)}" value="${gfEsc(S.notiz[v.id]||"")}">
        </div>`; }).join("")}`:`<p class="fd-empty">Gerade liegt kein Ball bei dir. Nichts zu übergeben.</p>`;
      fuss=`<button type="button" class="btn btn-brand" data-ue-zurueck>Zurück</button>${l.length?`<button type="button" class="btn btn-primary" id="vhUeOk" style="margin-left:auto" ${S.laedt?"disabled":""}>Übergabe senden</button>`:""}`;
    } else if(!S.abw && !S.neu && laufende().length){
      unter=S.anlass==="urlaub"?"Urlaub":"Krank";
      body=`<p class="vh-dlg-t">Für welche Abwesenheit?</p><div class="vh-ue-anlass">${laufende().map(a=>`<button type="button" class="vh-ue-a" data-abw="${gfEsc(a.id)}"><b>${gfEsc(gfVhTag(a.von))}${a.bis?" bis "+gfEsc(gfVhTag(a.bis)):a.bis_geschaetzt?" bis voraussichtlich "+gfEsc(gfVhTag(a.bis_geschaetzt)):""}</b><span>${a.status==="aktiv"?"läuft":"geplant"}${a.note?" · "+gfEsc(a.note):""}${a.vertretung_standard?" · Vertretung "+gfEsc(a.vertretung_standard):""}</span></button>`).join("")}
        <button type="button" class="vh-ue-a" data-abw-neu><b>Neue Abwesenheit anlegen</b><span>mit eigenem Zeitraum</span></button></div>`;
      fuss=`<button type="button" class="btn btn-brand" data-ue-zurueck>Zurück</button>`;
    } else if(!S.abw){
      unter=S.anlass==="urlaub"?"Urlaub":"Krank";
      body=`<div class="vh-pform-z"><label class="vh-fld">Ab<input type="date" id="vhUeVon" value="${gfEsc(S.form.von)}" required></label>
        <label class="vh-fld">${S.anlass==="urlaub"?"Bis (letzter Urlaubstag)":"Voraussichtlich bis (optional)"}<input type="date" id="vhUeBis" value="${gfEsc(S.form.bis)}" ${S.anlass==="urlaub"?"required":""}></label></div>
        <p class="vh-dlg-t">Vertretung: ${gfEsc(andere)}. Das Haus baut den Übergabekorb, die Vorhaben stehen gleich oben.</p>
        <label class="vh-ue-test"><input type="checkbox" id="vhUeTest" ${S.form.test?"checked":""}> Probe (Testabwesenheit, zählt nicht für Bänder und Für dich)</label>
        <p class="vh-dlg-t">Auch eine Probe baut den Korb aus den echten Vorhaben. Was du danach sendest, bewegt echte Bälle, bis die Probe endet.</p>`;
      fuss=`<button type="button" class="btn btn-brand" data-ue-zurueck>Zurück</button><button type="button" class="btn btn-primary" id="vhUeAnlegen" style="margin-left:auto" ${S.laedt?"disabled":""}>Weiter</button>`;
    } else {
      const a=S.abw; unter=`${S.anlass==="urlaub"?"Urlaub":S.anlass==="krank"?"Krank":"Abwesenheit"} ${gfVhTag(a.von)}${a.bis?" bis "+gfVhTag(a.bis):a.bis_geschaetzt?" bis voraussichtlich "+gfVhTag(a.bis_geschaetzt):""}${a.test?" · Probe":""}`;
      const probe=a.test?`<div class="vh-ew-warn" role="status">${gfZustand("warn","Probe")} Gesendete Wahlen bewegen echte Bälle, bis die Probe endet. <button type="button" class="btn btn-sm btn-ghost" id="vhUeProbeEnde">Probe beenden, Bälle zurück</button></div>`:"";
      body=probe+(S.korb.length?S.korb.map(z=>{ const w=S.wahl[z.id]; return `<div class="vh-ue-z">
          <div class="vh-ue-t"><b>${gfEsc(z.title)}</b><span>${gfEsc((z.dossier&&z.dossier.naechster_schritt)||"kein nächster Schritt")}</span>${z.status!=="vorschlag"?gfZustand("ok","entschieden: "+(z.ampel==="ruht"?"ruht":z.vertretung?"bei "+z.vertretung:"ohne Vertretung")+(w!==S.init[z.id]?" · wird geändert":"")):gfZustand("offen","Vorschlag, noch offen")}</div>
          ${chips(z.id,[["andere",andere+" übernimmt"],["ruht","Ruht bis "+rueck(a)],["team","Team"]],w,"Übergabe für "+z.title)}
          ${w==="team"?`<input class="vh-ue-n" data-name="${z.id}" maxlength="120" placeholder="Wer im Team? (Pflicht)" aria-label="Wer im Team übernimmt ${gfEsc(z.title)}" value="${gfEsc(S.name[z.id]||"")}">`:""}
        </div>`; }).join("")+(S.rest?`<p class="vh-dlg-t">Dazu ${S.rest} weitere Einträge im Korb (Themen, Kandidaten, Termine): <a href="uebergabe.html?id=${encodeURIComponent(a.id)}">in der Übergabe entscheiden →</a></p>`:"")
        :`<p class="fd-empty">Kein Vorhaben mit Ball bei dir im Korb. ${S.rest?`<a href="uebergabe.html?id=${encodeURIComponent(a.id)}">Übergabe öffnen →</a>`:""}</p>`);
      fuss=`<button type="button" class="btn btn-brand" data-ue-x>Später</button>${S.korb.length?`<button type="button" class="btn btn-primary" id="vhUeSenden" style="margin-left:auto" ${S.laedt?"disabled":""}>Übergabe senden</button>`:""}`;
    }
    m.innerHTML=`<div class="modal vh-dlg vh-ue" role="dialog" aria-modal="true" aria-labelledby="vhUeH">
      <div class="modal-h"><div class="vh-ue-kopf">${gfAvatarTag(ich,"vh-av")}<span aria-hidden="true">→</span>${gfAvatarTag(andere,"vh-av")}<div><h3 id="vhUeH">${kopf}</h3>${unter?`<div class="vh-dlg-t">${gfEsc(unter)}</div>`:""}</div></div><button type="button" class="icon-btn" data-ue-x aria-label="Schließen">✕</button></div>
      <div class="vh-dlg-b">${body}${S.fehler?`<div class="vh-ew-fehler" role="alert">${gfEsc(S.fehler)}</div>`:""}${S.laedt?`<div class="loading" role="status">Einen Augenblick …</div>`:""}</div>
      <div class="modal-f">${fuss}</div></div>`;
    m.classList.add("open");
    m.querySelectorAll("[data-ue-x]").forEach(b=>b.onclick=()=>{ if(!S.laedt) zu(); });
    m.querySelectorAll("[data-ue-zurueck]").forEach(b=>b.onclick=()=>{ S.anlass=null; S.fehler=""; render(); });
    m.querySelectorAll("[data-anlass]").forEach(b=>b.onclick=()=>waehleAnlass(b.dataset.anlass));
    m.querySelectorAll("[data-wahl]").forEach(b=>b.onclick=()=>{ S.wahl[b.dataset.wahl]=b.dataset.v; merke(); render(); m.querySelector(`[data-wahl="${CSS.escape(b.dataset.wahl)}"][data-v="${b.dataset.v}"]`)?.focus(); });
    const ok=m.querySelector("#vhUeOk"); if(ok) ok.onclick=schicht;
    const an=m.querySelector("#vhUeAnlegen"); if(an) an.onclick=anlegen;
    const se=m.querySelector("#vhUeSenden"); if(se) se.onclick=senden;
    m.querySelectorAll("[data-abw]").forEach(b=>b.onclick=async()=>{ S.laedt=true; render(); await korb(laufende().find(a=>a.id===b.dataset.abw)); S.laedt=false; render(); });
    const an2=m.querySelector("[data-abw-neu]"); if(an2) an2.onclick=()=>{ S.neu=true; render(); };
    const pe=m.querySelector("#vhUeProbeEnde"); if(pe) pe.onclick=async()=>{ S.laedt=true; render();
      try{ const d=await gfApi("absence_end",{ id:S.abw.id, by:ich }); zu(); gfToast(`Probe beendet, ${(d.vorhaben_zurueck||[]).length} Bälle zurück.`); await laden(true); }
      catch(e){ S.laedt=false; S.fehler="Probe nicht beendet: "+(e.message||"Verbindung"); render(); } };
    m.onkeydown=e=>{ if(e.key==="Escape" && !S.laedt) zu(); };
  }
  function merke(){
    m.querySelectorAll("[data-notiz]").forEach(i=>{ S.notiz[i.dataset.notiz]=i.value; });
    m.querySelectorAll("[data-name]").forEach(i=>{ S.name[i.dataset.name]=i.value; });
    const v=m.querySelector("#vhUeVon"), b=m.querySelector("#vhUeBis"), t=m.querySelector("#vhUeTest");
    if(v) S.form.von=v.value; if(b) S.form.bis=b.value; if(t) S.form.test=t.checked;
  }
  async function waehleAnlass(k){
    S.anlass=k; S.fehler="";
    if(k==="schicht"){ render(); return; }
    /* Keine Abwesenheit wird von selbst genommen: gibt es welche, wählt die Person aus (mit Zeitraum und Anlass), sonst legt sie an. */
    if(!laufende().length && k==="krank") S.form.von=heute;
    render();
  }
  async function korb(a){
    try{ const d=await gfApi("handover_list",{ absence_id:a.id }); S.abw=d.absence||a;
      const alle=d.items||[]; S.korb=alle.filter(x=>x.kind==="vorhaben"); S.rest=alle.length-S.korb.length;
      /* Bestätigte Zeilen zeigen, was gilt (und werden nur gesendet, wenn sich die Wahl ändert); offene Vorschläge
         bekommen eine Vorauswahl, die mit „Übergabe senden“ bestätigt wird. */
      for(const z of S.korb){
        const ist=z.ampel==="ruht"?"ruht":z.vertretung?(gfWhoNorm(z.vertretung)===andere?"andere":"team"):null;
        S.init[z.id]=z.status==="vorschlag"?null:ist;
        if(S.wahl[z.id]===undefined) S.wahl[z.id]=z.status==="vorschlag"?(z.ampel==="ruht"?"ruht":"andere"):ist;
        if(ist==="team" && S.name[z.id]===undefined) S.name[z.id]=z.vertretung; }
    }catch(e){ S.fehler="Der Korb ließ sich nicht laden: "+(e.message||"Verbindung"); }
  }
  async function anlegen(){
    merke();
    if(!S.form.von){ S.fehler="Bitte angeben, ab wann."; render(); return; }
    if(S.anlass==="urlaub" && !S.form.bis){ S.fehler="Bitte den letzten Urlaubstag angeben."; render(); return; }
    if(S.form.bis && S.form.bis<S.form.von){ S.fehler="Das Ende liegt vor dem Anfang."; render(); return; }
    S.laedt=true; S.fehler=""; render();
    try{
      const d=await gfApi("absence_set",{ person:ich, von:S.form.von, bis:S.anlass==="urlaub"?S.form.bis:null, bis_geschaetzt:S.anlass==="krank"?(S.form.bis||null):null,
        art:S.anlass==="urlaub"?"geplant":"sofort", kontakt:"keiner", vertretung_standard:andere, test:!!S.form.test, note:S.anlass==="urlaub"?"Urlaub":"Krank", who:ich });
      await korb(d.absence);
    }catch(e){ S.fehler="Nicht angelegt: "+(e.message||"Verbindung"); }
    S.laedt=false; render();
  }
  async function schicht(){
    merke();
    const eintraege=meine().map(v=>{ const w=S.wahl[v.id]||"bleibt", n=(S.notiz[v.id]||"").trim();
      if(w==="bleibt" && !n) return null;
      return { vorhaben_id:v.id, ball:w==="andere"?(andere==="Lea"?"lea":"alex"):w==="gf"?"gf":meinBall, expect_ball:v.ball, notiz:n||undefined }; }).filter(Boolean);
    if(!eintraege.length){ zu(); gfToast("Nichts geändert"); return; }
    S.laedt=true; S.fehler=""; render();
    try{ const d=await gfApi("schicht_uebergabe",{ von:ich, an:andere, eintraege, by:ich });
      S.laedt=false;
      if(!d.ok){ S.fehler=`${d.fehler.length} nicht übergeben: `+d.fehler.map(f=>{ const v=meine().find(x=>x.id===f.vorhaben_id); return `${v?v.title:"Vorhaben"} (${f.grund})`; }).join("; "); await laden(true); render(); return; }
      zu(); gfToast(`${(d.ergebnis||[]).filter(x=>x.ball_geaendert).length} Bälle an ${andere} übergeben, Notizen im Verlauf.`); await laden(true); if(AKTE_SLUG) oeffneAkte(AKTE_SLUG,{tabKeep:true,still:true});
    }catch(e){ S.laedt=false; S.fehler="Nicht gespeichert: "+(e.message||"Verbindung"); render(); }
  }
  async function senden(){
    merke();
    const fehlt=S.korb.filter(z=>S.wahl[z.id]==="team" && !(S.name[z.id]||"").trim());
    if(fehlt.length){ S.fehler=`Bitte für „${fehlt[0].title}“ angeben, wer im Team übernimmt.`; render(); return; }
    const amp=z=>["gruen","gelb","rot"].includes(z.ampel)?z.ampel:"gruen";
    /* Gesendet wird, was noch offen ist oder sich ausdrücklich ändert, jeweils mit dem gesehenen Stand (expect). */
    const items=S.korb.filter(z=>S.wahl[z.id] && (z.status==="vorschlag" || S.wahl[z.id]!==S.init[z.id] || (S.wahl[z.id]==="team" && (S.name[z.id]||"").trim()!==(z.vertretung||"")))).map(z=>{ const w=S.wahl[z.id];
      const expect={ status:z.status, ampel:z.ampel, vertretung:z.vertretung||null };
      return w==="ruht"?{ id:z.id, ampel:"ruht", expect } : { id:z.id, ampel:amp(z), vertretung:w==="team"?S.name[z.id].trim():andere, expect }; });
    if(!items.length){ zu(); gfToast("Nichts geändert."); return; }
    S.laedt=true; S.fehler=""; render();
    try{ const d=await gfApi("handover_set_many",{ items, by:ich });
      S.laedt=false;
      if(!d.ok){ S.fehler=`${d.updated} gespeichert, ${d.misslungen.length} nicht: `+d.misslungen.map(x=>`${x.titel||"Zeile"} (${x.grund})`).join("; ")+". Der Korb ist neu geladen, bitte die offenen Zeilen neu wählen.";
        /* Alles aus dem frischen Korb: frühere Wahlen und Namen gelten nicht weiter, sonst überschriebe ein alter Teamname eine neue Entscheidung. */
        S.wahl={}; S.name={}; S.init={}; await korb(S.abw); render(); return; }
      zu(); gfToast(`${d.updated} Vorhaben übergeben.`+(S.rest?" Den Rest des Korbs in der Übergabe entscheiden.":"")); await laden(true);
    }catch(e){ S.laedt=false; S.fehler="Nicht gespeichert: "+(e.message||"Verbindung"); render(); }
  }
  render();
  setTimeout(()=>m.querySelector("[data-anlass]")?.focus(),40);
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && $("#vhMenu") && !$("#vhMenu").hidden){ menu(false); document.querySelector("[data-menu]")?.focus(); return; }
  if(e.key==="Escape" && AKTE_SLUG && !$("#vhModal").classList.contains("open") && !document.querySelector(".modal-back.open")) schliesseAkte(); });
document.addEventListener("gf-who",()=>{ if(DATA){ renderSteuer(); renderMain(); } gfVhBadge(); });

/* Erledigte kommen aus einer eigenen Abfrage (vorhaben_list mit status erledigt); DATA bleibt bei aktiv und pausiert,
   damit Kopfzeile, Filterzahlen und Abzeichen nur Offenes zählen. */
/* Nur die jüngste Anfrage zählt: kommen Antworten verkehrt herum an, überschreibt eine alte nicht den neueren Stand. */
async function ladenErledigt(){
  const lauf=++ERL_LAUF;
  try{ const d=await gfApi("vorhaben_list",{ status:"erledigt" }); if(lauf!==ERL_LAUF) return; ERL=d.vorhaben||[]; ERL_GESAMT=d.gekuerzt?d.gesamt:0; ERL_FEHLER=""; }
  catch(e){ if(e.auth) throw e; if(lauf!==ERL_LAUF) return; ERL_FEHLER=e.message||"Verbindung"; }
}
async function laden(still){
  const lauf=++LADE_LAUF;
  const erl=ladenErledigt().catch(()=>{});
  let d;
  try{ d=await gfApi("vorhaben_list"); }
  catch(e){ if(e.auth) throw e; if(lauf!==LADE_LAUF) return; $("#vhMain").innerHTML=`<div class="empty soft">Die Vorhaben ließen sich nicht laden: ${gfEsc(e.message||"Verbindung")}. <button type="button" class="btn btn-sm btn-ghost" onclick="laden()">Noch einmal</button></div>`; return; }
  if(lauf!==LADE_LAUF) return;
  DATA=d; renderKopf(); renderSteuer(); renderMain(); gfVhBadge();
  await erl; if(lauf!==LADE_LAUF) return; renderSteuer(); if(FILTER==="erledigt") renderMain();
}
gfGate(async()=>{
  $("#app").style.display="block"; gfMountTopbar("vorhaben");
  await laden();
  const v=Q.get("v"); if(v){ const treffer=DATA?.vorhaben.find(x=>x.slug===v||x.id===v)||ERL?.find(x=>x.slug===v||x.id===v); oeffneAkte(treffer?treffer.slug:v,{ tab:TAB }); }
});
</script>
