<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#17171a" />
<title>Das Hohe Haus · Themen · Board</title>
<meta name="description" content="Themen der Geschäftsleitung als Board, Kacheln oder Liste. Vertraulich." />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=22" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png?v=22" />
<link rel="apple-touch-icon" href="/assets/icon-180.png?v=22" />
<link rel="manifest" href="/assets/manifest.webmanifest?v=22" />
<link rel="stylesheet" href="/assets/styles.css?v=22" />
<script>(function(){var t=localStorage.getItem("gf_theme");document.documentElement.dataset.theme=(t==="light"||t==="colorful")?"light":"dark";var n=null;try{n=localStorage.getItem("gf_nav")}catch(e){}var d=document.documentElement;d.dataset.nav=matchMedia("(max-width:1023px)").matches?"drawer":((n==="open"||n==="rail")?n:(matchMedia("(min-width:1280px)").matches?"open":"rail"));})();</script>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="mark pic"><img src="/assets/img/burg-288.png" alt="" width="54" height="54"></div>
    <span class="badge-conf">Wilde Möhre · vertraulich</span>
    <h1>Das Hohe Haus</h1>
    <div class="sub">Themen · Geschäftsführung der Wilden Habitate · Alex &amp; Lea</div>
    <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" />
    <button class="btn btn-primary" id="unlock" style="width:100%;justify-content:center;margin-top:4px">Entsperren</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="app wrap" id="app" style="--maxw:1400px">
  <header id="topbar"></header>
  <div id="subnav"></div>
  <div id="hero"></div>

  <div class="board-bar">
    <div class="search"><input id="q" placeholder="Themen durchsuchen … (Taste /)" /></div>
    <div class="segs" id="groupSegs" title="Wonach sollen die Spalten gebildet werden?">
      <button class="seg on" data-g="ablauf">Ablauf</button>
      <button class="seg" data-g="prio">Prio</button>
      <button class="seg" data-g="zeitraum">Zeitraum</button>
      <button class="seg" data-g="person">Person</button>
    </div>
    <label class="chk"><input type="checkbox" id="showRec" /> wiederkehrende zeigen</label>
    <label class="chk"><input type="checkbox" id="showDone" /> erledigte zeigen</label>
    <button class="btn btn-sm btn-brand" id="newTopic">＋ Thema</button>
    <button class="btn btn-sm btn-ghost" id="tidyAll" title="Themen, deren Text noch Marker wie „Titel:“, „Vorschlag:“ oder „Quelle:“ enthält">Aufräumen <span class="nbadge" id="tidyCount" hidden></span></button>
    <a class="btn btn-sm btn-primary" id="meetBtn" href="besprechung.html" title="Agenda der GF auf der Seite Besprechung">Besprechung</a>
  </div>

  <section class="meet" id="meet" hidden></section>
  <div id="view"></div>
  <div class="pop" id="movePop" hidden></div>
</div>

<!-- Detail-Panel -->
<div class="panel-back" id="panelBack"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-h"><h3 id="pTitle">Thema</h3><button class="icon-btn" id="pClose" title="Schließen">✕</button></div>
  <div class="panel-b" id="pBody"></div>
  <div class="panel-f" id="pFoot"></div>
</aside>

<div class="toast" id="toast"></div>
<div class="modal-back" id="tidyModal"></div>

<script src="/assets/core.js?v=22"></script>
<script src="/assets/game.js?v=22"></script>
<script src="/assets/eggs.js?v=22" defer></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const LANES=[["zu_besprechen","Zu besprechen","var(--accent)"],["in_klaerung","In Klärung","var(--warn)"],["entschieden","Entschieden · nächster Schritt","var(--info)"],["erledigt","Erledigt","var(--pos)"]];
const PRIOS=[["hoch","Hoch","var(--crit)"],["mittel","Mittel","var(--warn)"],["niedrig","Niedrig","var(--pos)"]];
const ZEIT=[["woche","Diese Woche","var(--crit)"],["monat","Dieser Monat","var(--warn)"],["spaeter","Später","var(--info)"],["ohne","Ohne Termin","var(--accent)"]];
const ST={offen:"Offen",in_klaerung:"In Klärung",erledigt:"Erledigt"};
const LANE_STATUS={zu_besprechen:"offen",in_klaerung:"in_klaerung",entschieden:"offen",erledigt:"erledigt"};

let TOPICS=[], PEOPLE=[];
const params=new URLSearchParams(location.search);
let VIEW=params.get("view")==="kacheln"?"kacheln":"board";
let GROUP=localStorage.getItem("gf_board_group")||"ablauf";
let SHOW_REC=localStorage.getItem("gf_board_rec")==="1", SHOW_DONE=localStorage.getItem("gf_board_done")==="1";
let Q="", DRAG=null, UNDO=null, UNDO_T=null;

/* ---- Datum-Helfer ---- */
const NOW=new Date(); const today=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
function iso(d){ return d.toISOString().slice(0,10); }
function endOfWeek(){ const d=new Date(today); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()+(6-dow)); return d; }
function endOfMonth(){ return new Date(today.getFullYear(),today.getMonth()+1,0); }
function zeitOf(t){ if(!t.next_suggested) return "ohne"; const d=new Date(t.next_suggested+"T00:00:00"); if(d<=endOfWeek()) return "woche"; if(d<=endOfMonth()) return "monat"; return "spaeter"; }
function ageDays(t){ return Math.floor((NOW-new Date(t.created_at))/86400000); }
function personKey(t){ return (t.owner||t.delegate_to||"").trim()||"niemand"; }

/* ---- Spalten je Gruppierung ---- */
function columns(list){
  if(GROUP==="ablauf") return LANES.map(([k,l,c])=>({key:k,label:l,color:c,items:list.filter(t=>t.board_lane===k).sort((a,b)=>a.lane_order-b.lane_order||(a.created_at<b.created_at?-1:1))}));
  if(GROUP==="prio") return PRIOS.map(([k,l,c])=>({key:k,label:l,color:c,items:list.filter(t=>t.priority===k).sort(byLane)}));
  if(GROUP==="zeitraum") return ZEIT.map(([k,l,c])=>({key:k,label:l,color:c,items:list.filter(t=>zeitOf(t)===k).sort((a,b)=>(a.next_suggested||"9")<(b.next_suggested||"9")?-1:1)}));
  const names=[...new Set(list.map(personKey))].sort((a,b)=>a==="niemand"?1:b==="niemand"?-1:a.localeCompare(b));
  return names.map(n=>({key:n,label:n==="niemand"?"Niemand zugeordnet":n,color:"var(--accent)",items:list.filter(t=>personKey(t)===n).sort(byLane)}));
}
function byLane(a,b){ const o={zu_besprechen:0,in_klaerung:1,entschieden:2,erledigt:3}; return (o[a.board_lane]-o[b.board_lane])||(a.lane_order-b.lane_order); }
function visible(){ return TOPICS.filter(t=>!t.archived && (SHOW_REC||t.kind!=="recurring") && (SHOW_DONE||GROUP==="ablauf"||t.status!=="erledigt") && (!Q||[t.title,t.short_description,t.context,t.owner,t.next_action,t.decision].join(" ").toLowerCase().includes(Q))); }

/* ---- Karte ---- */
function card(t){
  const age=ageDays(t); const stale=t.status!=="erledigt"&&age>28;
  const who=t.owner||t.delegate_to||"";
  return `<article class="bcard ${t.kind==="recurring"?"rec":""} ${stale?"stale":""}" draggable="true" data-id="${t.id}" tabindex="0">
    <div class="bm"><span class="pill p-${t.priority}">${t.priority}</span>${t.kind==="recurring"?`<span class="pill kindtag">wiederkehrend</span>`:""}${GROUP!=="ablauf"?`<span class="pill s-${t.status}">${LANES.find(l=>l[0]===t.board_lane)?.[1].split(" ·")[0]||ST[t.status]}</span>`:""}</div>
    <div class="bt">${gfEsc(t.title)}</div>
    ${t.short_description?`<div class="bn">${gfClamp(t.short_description,"b"+t.id+"s",120)}</div>`:""}
    ${t.next_action&&t.board_lane!=="erledigt"?`<div class="bn"><b>Nächster Schritt:</b> ${gfClamp(t.next_action,"b"+t.id+"n",120)}</div>`:""}
    ${t.decision&&t.board_lane==="entschieden"?`<div class="bn"><b>Entscheidung:</b> ${gfClamp(t.decision,"b"+t.id+"d",120)}</div>`:""}
    <div class="bf"><span>${who?gfEsc(who):""}${t.next_suggested?` · ${new Date(t.next_suggested+"T00:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}`:""}</span><span class="bf-r"><button class="mv" data-mv="${t.id}" title="Verschieben nach …" aria-label="Verschieben">⇄</button><span class="age" title="Alter des Themas">${age} T</span></span></div>
  </article>`;
}

/* ---- Rendern ---- */
const LANE_ICO={zu_besprechen:"spalte-zu-besprechen",in_klaerung:"spalte-in-klaerung",entschieden:"spalte-entschieden",erledigt:"spalte-erledigt",hoch:"tempo-4",mittel:"tempo-2",niedrig:"tempo-1"};
function laneIco(key){ const k=LANE_ICO[key]||(/^lea\b/i.test(key||"")?"portraet-lea":null); return (k&&window.GF_GAME)?`<img class="lane-ico" src="${GF_GAME.icon(k)}" alt="">`:""; }
function render(){
  document.querySelectorAll("#groupSegs .seg").forEach(b=>b.classList.toggle("on",b.dataset.g===GROUP));
  $("#showRec").checked=SHOW_REC; $("#showDone").checked=SHOW_DONE;
  const cols=columns(visible());
  const total=cols.reduce((n,c)=>n+c.items.length,0);
  if(VIEW==="board"){
    $("#view").innerHTML=`<div class="board">${cols.map(c=>`<section class="lane" data-col="${gfEsc(c.key)}">
      <div class="lane-h"><span class="bar" style="--c:${c.color}"></span>${laneIco(c.key)}${gfEsc(c.label)}<span class="n">${c.items.length}</span></div>
      ${c.items.map(card).join("")||`<div class="empty-lane">hierher ziehen</div>`}
    </section>`).join("")}</div>`;
  } else {
    $("#view").innerHTML=`<div class="tiles">${cols.filter(c=>c.items.length).map(c=>`<section class="lane tgroup" data-col="${gfEsc(c.key)}" style="min-height:0">
      <div class="tgroup-h"><span class="bar" style="--c:${c.color};width:var(--band);height:16px;display:inline-block;border-radius:var(--radius-s);background:var(--c)"></span>${laneIco(c.key)}${gfEsc(c.label)}<span class="n" style="margin-left:auto;background:var(--fill);border-radius:var(--radius-s);padding:1px 8px;font-size:var(--stufe-1)">${c.items.length}</span></div>
      <div class="tgrid">${c.items.map(card).join("")}</div>
    </section>`).join("")||`<div class="empty soft" style="text-align:center;padding:36px 22px">${window.GF_GAME?`<img class="zpic" src="${GF_GAME.icon("zustand-leer")}" alt="">`:""}<h3>Nichts zu zeigen</h3><p>Filter lockern oder ein neues Thema erfassen.</p></div>`}</div>`;
  }
  gfStagger($("#view"),".bcard"); updateTidyCount();
  if(MEET){ const cid=MEET.queue[MEET.idx]; const c=document.querySelector(`.bcard[data-id="${cid}"]`); if(c) c.classList.add("is-cur"); }
  const hp=$("#hero p"); if(hp) hp.textContent=`${total} Themen · Spalten nach ${ {ablauf:"Ablauf",prio:"Priorität",zeitraum:"Zeitraum",person:"Person"}[GROUP] } · ziehen zum Verschieben, antippen für Details`;
  bind();
}

/* ---- Verschieben: Zielspalte → Feldänderung je Gruppierung ---- */
function patchFor(col){
  if(GROUP==="ablauf") return { board_lane:col, status:LANE_STATUS[col] };
  if(GROUP==="prio") return { priority:col };
  if(GROUP==="zeitraum") return { next_suggested: col==="woche"?iso(endOfWeek()):col==="monat"?iso(endOfMonth()):col==="spaeter"?iso(new Date(today.getFullYear(),today.getMonth()+2,1)):"" };
  return { owner: col==="niemand"?"":col };
}
async function move(id, col, beforeId){
  const t=TOPICS.find(x=>x.id===id); if(!t) return;
  const patch=patchFor(col);
  if(GROUP==="ablauf"){
    const lane=TOPICS.filter(x=>x.board_lane===col && x.id!==id).sort((a,b)=>a.lane_order-b.lane_order);
    const idx=beforeId?lane.findIndex(x=>x.id===beforeId):lane.length;
    const prev=idx>0?lane[idx-1].lane_order:0, next=idx<lane.length?lane[idx].lane_order:(prev+2000);
    patch.lane_order=Math.floor((prev+next)/2);
    if(next-prev<2){ /* Neu durchnummerieren */ lane.splice(idx,0,t); await Promise.all(lane.map((x,i)=>{ x.lane_order=(i+1)*10; return gfApi("update",{id:x.id,lane_order:x.lane_order}); })); patch.lane_order=t.lane_order; }
  }
  const before={}; for(const k of Object.keys(patch)) before[k]=t[k];
  Object.assign(t,patch); render();
  try{ await gfApi("update",{id, ...patch}); showUndo(id,before); }
  catch(e){ Object.assign(t,before); render(); gfToast("Verschieben fehlgeschlagen: "+e.message); }
}
function showUndo(id,before){
  clearTimeout(UNDO_T); UNDO={id,before};
  const tt=$("#toast"); tt.innerHTML=`<span class="undo">Verschoben <button id="undoBtn">Rückgängig</button></span>`; tt.classList.add("show");
  $("#undoBtn").onclick=async()=>{ const t=TOPICS.find(x=>x.id===UNDO.id); Object.assign(t,UNDO.before); render(); try{ await gfApi("update",{id:UNDO.id,...UNDO.before}); }catch(e){} tt.classList.remove("show"); UNDO=null; };
  UNDO_T=setTimeout(()=>{ tt.classList.remove("show"); UNDO=null; },5000);
}

function bind(){
  document.querySelectorAll(".bcard").forEach(el=>{
    el.addEventListener("dragstart",e=>{ DRAG=el.dataset.id; el.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",DRAG); });
    el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); document.querySelectorAll(".lane.over").forEach(l=>l.classList.remove("over")); });
    el.addEventListener("click",e=>{ if(e.target.closest(".c-more")) return; if(e.target.closest(".mv")){ e.stopPropagation(); openMovePop(el.dataset.id, e.target.closest(".mv")); return; } if(MEET && MEET.queue.includes(el.dataset.id)){ MEET.idx=MEET.queue.indexOf(el.dataset.id); saveMeet(); renderMeet(); $("#meet").scrollIntoView({behavior:"smooth",block:"start"}); return; } openPanel(el.dataset.id); });
    el.addEventListener("keydown",e=>{ if(e.key==="Enter") openPanel(el.dataset.id); });
  });
  document.querySelectorAll(".lane").forEach(l=>{
    l.addEventListener("dragover",e=>{ e.preventDefault(); l.classList.add("over"); });
    l.addEventListener("dragleave",()=>l.classList.remove("over"));
    l.addEventListener("drop",e=>{ e.preventDefault(); l.classList.remove("over"); const id=DRAG||e.dataTransfer.getData("text/plain"); if(!id) return;
      const after=[...l.querySelectorAll(".bcard")].find(c=>{ const r=c.getBoundingClientRect(); return e.clientY < r.top + r.height/2; });
      move(id, l.dataset.col, after?after.dataset.id:null); DRAG=null; });
  });
}

/* ---- Detail-Panel (V15: Autosave, kein Verlust getippter Texte) ---- */
let OPEN=null, P_DIRTY=false, P_TIMER=null, P_BUSY=false;
const PANEL_FIELDS=["title","priority","next_suggested","owner","kind","short_description","next_action","decision","context","notes"];
function readPanel(){ const p={}; $("#pBody").querySelectorAll("[name]").forEach(i=>p[i.name]=i.value); return p; }
function panelChanges(t){ const p=readPanel(), out={}; for(const k of PANEL_FIELDS){ if(!(k in p)) continue; if(p[k]!==((t[k]??"")+"")) out[k]=p[k]; } return out; }
function setPStatus(txt, cls){ const s=$("#pStatus"); if(s){ s.textContent=txt; s.className="pstatus "+(cls||""); } }
function markDirty(){ P_DIRTY=true; setPStatus("Ungespeichert …","dirty"); clearTimeout(P_TIMER); P_TIMER=setTimeout(()=>savePanel({silent:true}),1500); }
function refreshPanelMeta(t){
  $("#pTitle").textContent=t.title;
  $("#pBody").querySelectorAll("[data-lane]").forEach(b=>b.classList.toggle("on",b.dataset.lane===t.board_lane));
  const m=$("#pMeta"); if(m) m.innerHTML=`angelegt ${new Date(t.created_at).toLocaleDateString("de-DE")} von ${gfEsc(t.created_by||"–")} · zuletzt geändert ${new Date(t.updated_at).toLocaleDateString("de-DE")}${t.last_discussed?` · zuletzt besprochen ${gfEsc(gfFmtShort(t.last_discussed))}`:""}`;
}
/* Speichert alle geänderten Felder (plus optionale Zusatzfelder). Getippter Text bleibt im Panel stehen. */
async function savePanel(opts={}){
  const t=TOPICS.find(x=>x.id===OPEN); if(!t) return true;
  clearTimeout(P_TIMER);
  const changes=Object.assign(panelChanges(t), opts.extra||{});
  if(!Object.keys(changes).length){ P_DIRTY=false; if(!opts.silent) setPStatus("Alles gespeichert","ok"); return true; }
  if(changes.decision && !(t.decision||"").trim() && t.board_lane==="zu_besprechen" && !("board_lane" in changes)){ changes.board_lane="entschieden"; changes.status="offen"; }
  setPStatus("Speichert …","busy"); P_BUSY=true;
  try{
    const d=await gfApi("update",{id:t.id,...changes}); Object.assign(t,d.topic);
    P_DIRTY=Object.keys(panelChanges(t)).length>0; // während des Speicherns weitergetippt?
    setPStatus(P_DIRTY?"Ungespeichert …":"Gespeichert "+gfFmtTime(new Date()), P_DIRTY?"dirty":"ok");
    if(P_DIRTY) markDirty();
    if(!opts.silent) gfToast(opts.toast||"Gespeichert");
    render(); if(OPEN===t.id) refreshPanelMeta(t);
    return true;
  }catch(e){ setPStatus("Nicht gespeichert: "+(e.message||"Verbindung"),"err"); gfToast("Speichern fehlgeschlagen: "+(e.message||"Verbindung")); return false; }
  finally{ P_BUSY=false; }
}
function openPanel(id){
  const t=TOPICS.find(x=>x.id===id); if(!t) return;
  if(OPEN && OPEN!==id && P_DIRTY) savePanel({silent:true});
  OPEN=id; P_DIRTY=false; clearTimeout(P_TIMER);
  const people=[...new Set([...PEOPLE.map(p=>p.name),"Alex","Lea","Lea & Alex"].filter(Boolean))];
  $("#pBody").innerHTML=`
    <div class="move-row">${LANES.map(([k,l])=>`<button class="seg ${t.board_lane===k?"on":""}" data-lane="${k}">${l.split(" ·")[0]}</button>`).join("")}</div>
    <div class="fgrid">
      <div class="fld ffull"><label>Titel</label><input name="title" value="${gfEsc(t.title)}" /></div>
      <div class="fld"><label>Priorität</label>${gfChips("priority",PRIOS.map(([k,l])=>[k,l]),t.priority||"mittel",{label:"Priorität"})}</div>
      <div class="fld"><label>Termin</label><input name="next_suggested" type="date" value="${t.next_suggested||""}" /></div>
      <div class="fld"><label>Verantwortung</label><input name="owner" list="peopleList" value="${gfEsc(t.owner||"")}" /><datalist id="peopleList">${people.map(p=>`<option value="${gfEsc(p)}">`).join("")}</datalist></div>
      <div class="fld"><label>Art</label>${gfChips("kind",[["einmalig","Einmalig"],["recurring","Wiederkehrend"]],t.kind==="recurring"?"recurring":"einmalig",{label:"Art"})}</div>
      <div class="fld ffull"><label>Ein Satz</label><input name="short_description" value="${gfEsc(t.short_description||"")}" /></div>
      <div class="fld ffull"><label>Nächster Schritt</label><textarea name="next_action">${gfEsc(t.next_action||"")}</textarea></div>
      <div class="fld ffull"><label>Entscheidung</label><textarea name="decision">${gfEsc(t.decision||"")}</textarea></div>
      <div class="fld ffull"><label>Kontext</label><textarea name="context" rows="5">${gfEsc(t.context||"")}</textarea></div>
      <div class="fld ffull"><label>Notizen</label><textarea name="notes">${gfEsc(t.notes||"")}</textarea></div>
    </div>
    <div class="site-meta" id="pMeta"></div>`;
  $("#pFoot").innerHTML=`<div class="pstatus" id="pStatus"></div>
    <button class="btn btn-primary" id="pSave">Speichern &amp; schließen</button>
    <button class="btn btn-ghost" id="pTidy" title="Kontext in Titel, Entscheidung, Nächster Schritt und Notizen aufteilen">Bereinigen</button>
    <button class="btn btn-ghost" id="pDiscussed" title="Setzt „zuletzt besprochen“ auf heute">heute besprochen</button>
    <button class="btn btn-ghost del" id="pDelete" style="margin-left:auto;color:var(--crit)">Löschen</button>`;
  refreshPanelMeta(t);
  const body=$("#pBody");
  body.oninput=e=>{ if(e.target.matches("[name]")) markDirty(); };
  body.onchange=e=>{ if(e.target.matches("[name]")) savePanel({silent:true}); };
  body.querySelectorAll("[data-lane]").forEach(b=>b.onclick=()=>{ const col=b.dataset.lane; if(col===t.board_lane) return; savePanel({extra:{board_lane:col,status:LANE_STATUS[col]}, toast:"Verschoben nach "+LANES.find(l=>l[0]===col)[1].split(" ·")[0]}); });
  $("#pSave").onclick=async()=>{ if(await savePanel({silent:true})){ gfToast("Gespeichert"); closePanel(true); } };
  $("#pTidy").onclick=()=>openTidy(t.id);
  $("#pDiscussed").onclick=()=>savePanel({extra:{last_discussed:iso(today)}, toast:"Als heute besprochen markiert"});
  $("#pDelete").onclick=async()=>{ if(!confirm(`„${t.title}" löschen?`)) return; try{ await gfApi("delete",{id:t.id}); TOPICS=TOPICS.filter(x=>x.id!==t.id); P_DIRTY=false; render(); closePanel(true); gfToast("Gelöscht"); }catch(e){ gfToast("Fehler: "+e.message); } };
  $("#panel").classList.add("open"); $("#panel").setAttribute("aria-hidden","false"); $("#panelBack").classList.add("open");
  const tidy=gfTidyTopic(t); $("#pTidy").classList.toggle("has-hint",!!tidy); if(tidy) $("#pTidy").title="Es gibt Marker im Text („"+tidy.found.slice(0,3).join("“, „")+"“). Aufteilung vorschlagen.";
}
async function closePanel(force){
  if(!force && OPEN && P_DIRTY){ const ok=await savePanel({silent:true}); if(!ok && !confirm("Speichern ist fehlgeschlagen. Trotzdem schließen? Die Änderungen gehen dann verloren.")) return; }
  $("#panel").classList.remove("open"); $("#panel").setAttribute("aria-hidden","true"); $("#panelBack").classList.remove("open"); OPEN=null; P_DIRTY=false; clearTimeout(P_TIMER);
}
window.addEventListener("beforeunload",e=>{ if(OPEN && P_DIRTY){ savePanel({silent:true}); e.preventDefault(); e.returnValue=""; } });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden" && OPEN && P_DIRTY) savePanel({silent:true}); });
$("#pClose").onclick=()=>closePanel(); $("#panelBack").onclick=()=>closePanel();
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const tm=document.getElementById("tidyModal"); if(tm&&tm.classList.contains("open")){ tm.classList.remove("open"); return; } closePanel(); } if(e.key==="/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $("#q").focus(); } });

/* ---- Bereinigen (V15): Marker im Text → Felder ---- */
function tidyCandidates(){ return TOPICS.filter(t=>!t.archived && (SHOW_DONE||t.board_lane!=="erledigt") && gfTidyTopic(t)); }
function updateTidyCount(){ const n=tidyCandidates().length; const b=$("#tidyCount"); b.textContent=n; b.hidden=!n; $("#tidyAll").classList.toggle("has-hint",n>0); }
async function openTidy(id, preset){
  const t=TOPICS.find(x=>x.id===id); if(!t) return;
  if(OPEN===id && P_DIRTY) await savePanel({silent:true});
  const res=preset||gfTidyTopic(t); const ch=res?res.changes:{}; const fields=Object.keys(GF_TIDY_FIELDS).filter(f=>f in ch && (ch[f]||"")!==(t[f]||""));
  const m=$("#tidyModal");
  const intro=preset&&preset.ai ? `Vorschlag von Claude${res.note?` · ${gfEsc(res.note)}`:""}. Rechts prüfen, ggf. ändern, dann übernehmen.` : (res ? `Erkannt: „${res.found.map(gfEsc).join("“, „")}“. Links der bisherige Stand, rechts der Vorschlag. Rechts kannst du noch ändern.` : `Keine Marker im Text gefunden. Ein KI-Vorschlag kann den Freitext trotzdem aufteilen.`);
  m.innerHTML=`<div class="modal tidy" role="dialog" aria-modal="true" aria-label="Bereinigen">
    <div class="modal-h"><h3>Bereinigen</h3><button class="icon-btn" data-x title="Schließen">✕</button></div>
    <p class="modal-intro"><b>${gfEsc(t.title.length>90?t.title.slice(0,90)+"…":t.title)}</b><br>${intro}</p>
    <div class="tidy-body">${fields.map(f=>`<div class="tidy-row"><div class="tidy-k">${GF_TIDY_FIELDS[f]}</div>
        <div class="tidy-old"><label>bisher</label><div class="tidy-txt">${(t[f]||"").trim()?gfEsc(t[f]):"<i>leer</i>"}</div></div>
        <div class="tidy-new"><label>neu</label><textarea data-f="${f}" rows="${f==="context"?7:(f==="title"||f==="owner"||f==="short_description"?2:3)}">${gfEsc(ch[f])}</textarea></div>
      </div>`).join("")||`<div class="tidy-none">Nichts aufzuteilen.</div>`}</div>
    <div class="modal-f"><button class="btn btn-primary" data-apply ${fields.length?"":'disabled title="Nichts zu übernehmen: kein Feld hat sich geändert"'}>Übernehmen</button><button class="btn btn-ghost" data-ai title="Claude teilt den Text in die Felder auf">KI-Vorschlag</button><span class="tidy-note" data-note></span><button class="btn btn-ghost" data-x style="margin-left:auto">Abbrechen</button></div>
  </div>`;
  m.classList.add("open");
  const close=()=>m.classList.remove("open");
  m.querySelectorAll("[data-x]").forEach(b=>b.onclick=close); m.onclick=e=>{ if(e.target===m) close(); };
  m.querySelector("[data-apply]").onclick=async()=>{
    const patch={id:t.id}; m.querySelectorAll("textarea[data-f]").forEach(a=>{ if(a.value!==((t[a.dataset.f]??"")+"")) patch[a.dataset.f]=a.value; });
    if(Object.keys(patch).length===1){ close(); return; }
    try{ const d=await gfApi("update",patch); Object.assign(t,d.topic); render(); if(OPEN===t.id){ P_DIRTY=false; openPanel(t.id); } gfToast("Bereinigt und gespeichert"); close(); }
    catch(e){ gfToast("Fehler: "+e.message); }
  };
  m.querySelector("[data-ai]").onclick=async(ev)=>{
    const b=ev.currentTarget, note=m.querySelector("[data-note]"); b.disabled=true; note.textContent="Claude liest …";
    try{ const d=await gfApi("tidy_suggest",{id:t.id}); openTidy(t.id,{ai:true,changes:d.changes||{},found:["KI"],note:d.model?`${d.model}`:""}); }
    catch(e){ b.disabled=false; note.textContent=/ANTHROPIC_API_KEY|Schl.ssel|key/i.test(e.message||"")?"Kein API-Schlüssel hinterlegt (Supabase-Secret ANTHROPIC_API_KEY).":"Fehler: "+(e.message||"Verbindung"); }
  };
}
function openTidyAll(){
  const list=tidyCandidates().sort(byLane); const m=$("#tidyModal");
  m.innerHTML=`<div class="modal tidy" role="dialog" aria-modal="true" aria-label="Aufräumen">
    <div class="modal-h"><h3>Aufräumen · ${list.length} Themen</h3><button class="icon-btn" data-x title="Schließen">✕</button></div>
    <p class="modal-intro">Diese Themen tragen noch Eingabe-Marker im Titel oder Kontext. Je Thema den Vorschlag ansehen und übernehmen.</p>
    <div class="tidy-body">${list.map(t=>{ const r=gfTidyTopic(t); return `<button class="tidy-item" data-id="${t.id}"><span class="pill s-${t.status}">${LANES.find(l=>l[0]===t.board_lane)?.[1].split(" ·")[0]||""}</span><span class="tidy-it">${gfEsc(t.title.length>110?t.title.slice(0,110)+"…":t.title)}</span><span class="tidy-found">${r.found.slice(0,4).map(gfEsc).join(" · ")}</span></button>`; }).join("")||`<div class="tidy-none">Alles aufgeräumt.</div>`}</div>
    <div class="modal-f"><button class="btn btn-ghost" data-x style="margin-left:auto">Schließen</button></div></div>`;
  m.classList.add("open");
  m.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>m.classList.remove("open")); m.onclick=e=>{ if(e.target===m) m.classList.remove("open"); };
  m.querySelectorAll(".tidy-item").forEach(b=>b.onclick=()=>openTidy(b.dataset.id));
}
$("#tidyAll").onclick=openTidyAll;

/* ---- Steuerung ---- */
$("#groupSegs").onclick=e=>{ const b=e.target.closest(".seg"); if(!b) return; GROUP=b.dataset.g; localStorage.setItem("gf_board_group",GROUP); render(); };
$("#showRec").onchange=e=>{ SHOW_REC=e.target.checked; localStorage.setItem("gf_board_rec",SHOW_REC?"1":"0"); render(); };
$("#showDone").onchange=e=>{ SHOW_DONE=e.target.checked; localStorage.setItem("gf_board_done",SHOW_DONE?"1":"0"); render(); };
$("#q").oninput=e=>{ Q=e.target.value.trim().toLowerCase(); render(); };
$("#newTopic").onclick=async()=>{ const title=prompt("Neues Thema (Titel):"); if(!title) return; try{ const d=await gfApi("add",{title,priority:"mittel",created_by:gfWho(),board_lane:"zu_besprechen"}); TOPICS.push(d.topic); render(); openPanel(d.topic.id); }catch(e){ gfToast("Fehler: "+e.message); } };

/* ---- Verschieben per Menü (Touch, Tastatur) ---- */
function openMovePop(id, anchor){
  const t=TOPICS.find(x=>x.id===id); if(!t) return;
  const cols=columns(TOPICS).map(c=>({key:c.key,label:c.label}));
  const cur = GROUP==="ablauf"?t.board_lane:GROUP==="prio"?t.priority:GROUP==="zeitraum"?zeitOf(t):personKey(t);
  const pop=$("#movePop");
  pop.innerHTML=`<div class="pop-h">Verschieben nach …</div>${cols.map(c=>`<button class="pop-i ${c.key===cur?"on":""}" data-col="${gfEsc(c.key)}">${gfEsc(c.label.split(" ·")[0])}</button>`).join("")}<button class="pop-i" data-details>Details öffnen</button>`;
  pop.hidden=false;
  const r=anchor.getBoundingClientRect(); const w=Math.min(260, window.innerWidth-24);
  pop.style.left=Math.max(12, Math.min(r.left, window.innerWidth-w-12))+"px"; pop.style.top=(r.bottom+window.scrollY+6)+"px"; pop.style.width=w+"px";
  pop.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{ pop.hidden=true; if(b.dataset.col!==cur) move(id,b.dataset.col,null); });
  pop.querySelector("[data-details]").onclick=()=>{ pop.hidden=true; openPanel(id); };
  setTimeout(()=>document.addEventListener("click",closePop,{once:true}),0);
}
function closePop(e){ const pop=$("#movePop"); if(e && pop.contains(e.target)){ document.addEventListener("click",closePop,{once:true}); return; } pop.hidden=true; }

/* ---- Besprechungsmodus (Sprint C) ---- */
let MEET=null, MEET_T=null;
try{ MEET=JSON.parse(localStorage.getItem("gf_meeting")||"null"); }catch(e){ MEET=null; }
function saveMeet(){ try{ if(MEET) localStorage.setItem("gf_meeting",JSON.stringify(MEET)); else localStorage.removeItem("gf_meeting"); }catch(e){} }
function meetQueue(){
  const v=TOPICS.filter(t=>!t.archived && (SHOW_REC||t.kind!=="recurring") && (t.board_lane==="zu_besprechen"||t.board_lane==="in_klaerung"));
  const po={hoch:0,mittel:1,niedrig:2}; const lo={zu_besprechen:0,in_klaerung:1};
  return v.sort((a,b)=>(lo[a.board_lane]-lo[b.board_lane])||(po[a.priority]-po[b.priority])||(a.lane_order-b.lane_order)).map(t=>t.id);
}
async function startMeet(){
  const participants=prompt("Wer ist dabei?","Alex, Lea"); if(participants===null) return;
  try{
    const d=await gfApi("session_start",{participants, started_by:gfWho()});
    MEET={ sessionId:d.session.id, started:d.session.started_at, participants, queue:meetQueue(), idx:0, log:[] };
    saveMeet(); renderMeet(); render(); gfToast("Besprechung gestartet");
  }catch(e){ gfToast("Start fehlgeschlagen: "+e.message); }
}
function fmtDur(ms){ const s=Math.floor(ms/1000); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60; return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"); }
function renderMeet(){
  const box=$("#meet"); clearInterval(MEET_T);
  if(!MEET){ box.hidden=true; box.innerHTML=""; $("#meetBtn").textContent="Besprechung starten"; $("#meetBtn").classList.remove("btn-ghost"); return; }
  box.hidden=false; $("#meetBtn").textContent="Besprechung läuft …"; $("#meetBtn").classList.add("btn-ghost");
  // Queue aktualisieren: neue Themen anhängen, erledigte behalten (Log), aktuelle Position halten
  const fresh=meetQueue(); for(const id of fresh) if(!MEET.queue.includes(id) && !MEET.log.some(l=>l.id===id)) MEET.queue.push(id);
  MEET.queue=MEET.queue.filter(id=>TOPICS.some(t=>t.id===id));
  const doneIds=new Set(MEET.log.map(l=>l.id));
  const pending=MEET.queue.filter(id=>!doneIds.has(id));
  if(MEET.idx>=MEET.queue.length) MEET.idx=Math.max(0,MEET.queue.length-1);
  let cur=TOPICS.find(t=>t.id===MEET.queue[MEET.idx]);
  if(cur && doneIds.has(cur.id) && pending.length){ MEET.idx=MEET.queue.indexOf(pending[0]); cur=TOPICS.find(t=>t.id===pending[0]); }
  const nDec=MEET.log.filter(l=>l.outcome==="entschieden").length;
  const head=`<div class="meet-h">
      <div class="meet-timer" id="meetTimer">00:00</div>
      <div class="meet-meta"><b>Besprechung</b> · ${gfEsc(MEET.participants)} · ${MEET.log.length} von ${MEET.queue.length} behandelt · ${nDec} Entscheidung${nDec===1?"":"en"}</div>
      <div class="meet-actions"><button class="btn btn-sm btn-ghost" id="meetPrev" title="Vorheriges Thema">◀</button><button class="btn btn-sm btn-ghost" id="meetNext" title="Nächstes offenes Thema">▶</button><button class="btn btn-sm btn-primary" id="meetEnd">Beenden · Protokoll</button></div>
    </div>`;
  let body="";
  if(!cur || !pending.length){
    if(MEET.log.length) document.dispatchEvent(new CustomEvent("gf-egg-bus"));
    body=`<div class="meet-done"><h3>Alle Themen behandelt.</h3><p>${MEET.log.length} Themen, ${nDec} Entscheidung${nDec===1?"":"en"}. Mit „Beenden · Protokoll“ abschließen oder ein Thema im Board antippen, um es noch einmal aufzurufen.</p></div>`;
  } else {
    const done=doneIds.has(cur.id); const pos=pending.indexOf(cur.id);
    body=`<div class="meet-cur ${done?"is-done":""}" data-id="${cur.id}">
      <div class="meet-cur-h"><span class="pill p-${cur.priority}">${cur.priority}</span><span class="pill s-${cur.status}">${LANES.find(l=>l[0]===cur.board_lane)?.[1].split(" ·")[0]||""}</span>${cur.kind==="recurring"?`<span class="pill kindtag">wiederkehrend</span>`:""}<span class="meet-pos">${pos>=0?`Thema ${pos+1} von ${pending.length} offen`:"bereits behandelt"} · ${ageDays(cur)} Tage alt</span><button class="btn btn-sm btn-ghost" id="meetDetails" style="margin-left:auto">Details</button></div>
      <h3 class="meet-title">${gfEsc(cur.title)}</h3>
      ${cur.short_description?`<p class="meet-desc">${gfEsc(cur.short_description)}</p>`:""}
      ${cur.context?`<div class="meet-ctx">${gfClamp(cur.context,"m"+cur.id,260)}</div>`:""}
      <div class="fgrid meet-form">
        <div class="fld ffull"><label>Entscheidung</label><textarea id="mDecision" rows="2" placeholder="Was ist entschieden? Ein bis zwei Sätze.">${gfEsc(cur.decision||"")}</textarea></div>
        <div class="fld"><label>Nächster Schritt</label><input id="mNext" value="${gfEsc(cur.next_action||"")}" placeholder="Was passiert als Nächstes?" /></div>
        <div class="fld"><label>Verantwortung</label><input id="mOwner" list="peopleList2" value="${gfEsc(cur.owner||"")}" /><datalist id="peopleList2">${[...new Set([...PEOPLE.map(p=>p.name),"Alex","Lea","Lea & Alex"])].map(p=>`<option value="${gfEsc(p)}">`).join("")}</datalist></div>
      </div>
      <div class="meet-btns">
        <button class="btn btn-primary" data-o="entschieden" title="Entscheidung festhalten, Thema nach „Entschieden“">Entschieden</button>
        <button class="btn" data-o="in_klaerung" title="Braucht noch Klärung">In Klärung</button>
        <button class="btn" data-o="erledigt">Erledigt</button>
        <button class="btn" data-o="vertagt" data-days="7" title="Termin auf nächste Woche">Vertagen 1 Woche</button>
        <button class="btn" data-o="vertagt" data-days="30" title="Termin auf nächsten Monat">Vertagen 1 Monat</button>
        <button class="btn btn-ghost" data-o="besprochen" title="Nur als besprochen markieren, weiter">Besprochen, weiter</button>
        <button class="btn btn-ghost" data-o="skip" title="Ohne Vermerk zum nächsten Thema">Überspringen</button>
      </div>
    </div>`;
  }
  box.innerHTML=head+body;
  const tick=()=>{ const el=$("#meetTimer"); if(el) el.textContent=fmtDur(Date.now()-new Date(MEET.started)); }; tick(); MEET_T=setInterval(tick,1000);
  $("#meetEnd").onclick=endMeet;
  $("#meetPrev").onclick=()=>{ if(MEET.idx>0){ MEET.idx--; saveMeet(); renderMeet(); } };
  $("#meetNext").onclick=()=>{ const nxt=pending.find(id=>MEET.queue.indexOf(id)>MEET.idx)||pending[0]; if(nxt){ MEET.idx=MEET.queue.indexOf(nxt); saveMeet(); renderMeet(); } };
  const md=$("#meetDetails"); if(md&&cur) md.onclick=()=>openPanel(cur.id);
  box.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>meetOutcome(cur, b.dataset.o, parseInt(b.dataset.days)||0));
  document.querySelectorAll(".bcard.is-cur").forEach(c=>c.classList.remove("is-cur")); if(cur){ const c=document.querySelector(`.bcard[data-id="${cur.id}"]`); if(c) c.classList.add("is-cur"); }
}
function advanceMeet(){
  const doneIds=new Set(MEET.log.map(l=>l.id)); const pending=MEET.queue.filter(id=>!doneIds.has(id));
  const nxt=pending.find(id=>MEET.queue.indexOf(id)>MEET.idx)||pending[0];
  if(nxt) MEET.idx=MEET.queue.indexOf(nxt);
  saveMeet(); renderMeet();
}
async function meetOutcome(t, outcome, days){
  if(outcome==="skip"){ const doneIds=new Set(MEET.log.map(l=>l.id)); const pending=MEET.queue.filter(id=>!doneIds.has(id)&&id!==t.id); const nxt=pending.find(id=>MEET.queue.indexOf(id)>MEET.idx)||pending[0]; if(nxt){ MEET.idx=MEET.queue.indexOf(nxt); saveMeet(); renderMeet(); } else gfToast("Kein weiteres offenes Thema"); return; }
  const decision=$("#mDecision").value.trim(), next_action=$("#mNext").value.trim(), owner=$("#mOwner").value.trim();
  if(outcome==="entschieden" && !decision){ gfToast("Bitte die Entscheidung in ein bis zwei Sätzen festhalten."); $("#mDecision").focus(); return; }
  const patch={ id:t.id, last_discussed:iso(today), next_action, owner };
  if(decision) patch.decision=decision;
  let until=null;
  if(outcome==="entschieden"){ patch.board_lane="entschieden"; patch.status="offen"; }
  if(outcome==="in_klaerung"){ patch.board_lane="in_klaerung"; patch.status="in_klaerung"; }
  if(outcome==="erledigt"){ patch.board_lane="erledigt"; patch.status="erledigt"; }
  if(outcome==="vertagt"){ const d=new Date(today); d.setDate(d.getDate()+days); until=iso(d); patch.next_suggested=until; }
  try{
    const d=await gfApi("update",patch); Object.assign(t,d.topic);
    if(outcome==="entschieden") await gfApi("decision_add",{ topic_id:t.id, session_id:MEET.sessionId, topic_title:t.title, decision, next_action, owner, decided_by:gfWho() });
    MEET.log=MEET.log.filter(l=>l.id!==t.id); MEET.log.push({ id:t.id, title:t.title, outcome, decision:outcome==="entschieden"?decision:"", next_action, owner, until });
    gfToast({entschieden:"Entscheidung festgehalten",in_klaerung:"Nach „In Klärung“",erledigt:"Erledigt",vertagt:"Vertagt bis "+gfFmtShort(until),besprochen:"Als besprochen markiert"}[outcome]);
    render(); advanceMeet();
  }catch(e){ gfToast("Speichern fehlgeschlagen: "+e.message); }
}
async function endMeet(){
  if(!MEET) return;
  const ended=new Date().toISOString();
  const openTopics=TOPICS.filter(t=>t.board_lane==="zu_besprechen" && t.kind!=="recurring" && !MEET.log.some(l=>l.id===t.id));
  const text=gfProtocolText({started:MEET.started, ended, participants:MEET.participants}, MEET.log, openTopics);
  try{ await gfApi("session_end",{ id:MEET.sessionId, protocol:text, summary:MEET.log, title:`Besprechung ${gfFmtShort(MEET.started)}` }); }
  catch(e){ gfToast("Speichern des Protokolls fehlgeschlagen: "+e.message); }
  MEET=null; saveMeet(); renderMeet(); render();
  gfTextModal("Protokoll der Besprechung", text, { subject:`GF-Besprechung ${gfFmtShort(ended)} · Protokoll`, intro:"Gespeichert unter Themen › Entscheidungen. Hier kopieren oder per Mail verschicken.", extra:`<a class="btn btn-ghost" href="entscheidungen.html">Entscheidungslog</a>` });
}
/* V22d: Besprechungsmodus lebt auf besprechung.html; #meetBtn ist dort ein Link. Bestehende laufende Sitzung (gf_meeting) wird weiter gerendert. */

gfGate(async()=>{
  $("#app").style.display="block"; gfMountTopbar("themen"); gfMountSubnav(VIEW);
  gfMountHero(VIEW==="board"?"lagerfeuer":"karten", VIEW==="board"?"Board":"Kacheln", "lädt …", {compact:true, aside:`<a class="btn btn-sm" href="capture.html">Thema erfassen</a><a class="btn btn-sm" href="besprechung.html">Zur Besprechung</a>`});
  $("#view").innerHTML=`<div class="board">${LANES.map(()=>`<section class="lane">${gfSkeleton(2,"")}</section>`).join("")}</div>`;
  try{ const [d,p]=await Promise.all([gfApi("list"), gfLoadPeople()]); TOPICS=d.topics||[]; PEOPLE=p||[]; render(); renderMeet(); const tid=params.get("topic"); if(tid) openPanel(tid); if(params.get("meeting")==="1" && !MEET) location.href="besprechung.html"; }
  catch(e){ $("#view").innerHTML=`<div class="empty">Fehler beim Laden: ${gfEsc(e.message||"Verbindung")}</div>`; }
});
</script>
